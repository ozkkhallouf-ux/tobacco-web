# overlay تطوير — لا يُحمَّل تلقائياً. لا يُغيّر شيئاً في سلوك
# `docker compose up` الافتراضي (docker-compose.yml وحده)؛ يجب تمريره صراحةً:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# الهدف: تعديل الكود على المضيف (Mac أو Windows) يظهر داخل الحاوية فوراً بلا
# rebuild — لأن الموقع بلا bundler أصلاً (serve.mjs يقرأ كل ملف من القرص عند
# كل طلب)، فيكفي bind mount لمصادر الواجهة؛ تحديث المتصفح وحده كافٍ.
#
# ما لا يتغيّر عن docker-compose.yml الأساسي: نفس target: runtime، نفس
# read_only (صحيح لأن flag القراءة-فقط يخص جذر نظام ملفات الحاوية فقط —
# الـbind mounts أدناه مستقلة عنه وتُحدَّد قراءتها/كتابتها بنفسها)، نفس
# cap_drop/no-new-privileges/tmpfs. لا أسرار ولا tools/ ولا Ameen SQL هنا —
# هذه الحدود موروثة من .dockerignore ولم تُمسّ، وBuild context هنا كما هو.
#
# PORT: القيمة الوحيدة القابلة للتغيير هي منفذ المضيف المنشور، عبر متغير بيئة
# PORT بنفس الاسم على Mac (`export PORT=5174`) وWindows PowerShell
# (`$env:PORT=5174`) — الافتراضي 5173 إن لم يُحدَّد. منفذ الحاوية الداخلي يبقى
# 5173 ثابتاً عمداً: HEALTHCHECK في Dockerfile مبني على 5173 تحديداً ولم يُعدَّل
# (خارج نطاق هذه المرحلة)، فتغييره داخلياً يُفسد فحص healthy.
# HOST=0.0.0.0 مضبوط صراحة هنا للتوثيق فقط: هذا ربط الاستماع *داخل* الحاوية،
# مطلوب دائماً كي يعمل نشر منفذ Docker بصرف النظر عن نظام المضيف — وهو
# الافتراضي الحالي أصلاً في serve.mjs فلا تغيير سلوك فعلي.
services:
  web:
    image: tobacco-web:dev-local
    environment:
      - HOST=0.0.0.0
      - PORT=5173
    ports:
      - "${PORT:-5173}:5173"
    volumes:
      # ملفات الجذر العامة نفسها التي ينسخها Dockerfile — قراءة فقط.
      - ./index.html:/app/index.html:ro
      - ./404.html:/app/404.html:ro
      - ./privacy-policy.html:/app/privacy-policy.html:ro
      - ./terms-of-use.html:/app/terms-of-use.html:ro
      - ./receipt.html:/app/receipt.html:ro
      - ./robots.txt:/app/robots.txt:ro
      - ./sitemap.xml:/app/sitemap.xml:ro
      - ./service-worker.js:/app/service-worker.js:ro
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      # منطق الخادم نفسه — تعديله يحتاج إعادة تشغيل الحاوية (لا rebuild) كي
      # يُحمَّل من جديد: docker compose -f docker-compose.yml -f docker-compose.dev.yml restart
      - ./scripts/serve.mjs:/app/scripts/serve.mjs:ro
