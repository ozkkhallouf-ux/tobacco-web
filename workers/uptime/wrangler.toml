# ozk-uptime — محلي فقط حتى موافقة المالك. لا تنشر قبل الموافقة.
name = "ozk-uptime"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
DRY_RUN = "1"

# التخزين: Namespace واحد `ozk-uptime-state` في حساب المالك A (Free). الربط وحده لا ينشر شيئاً؛ النشر والـcron الفعلي بموافقة منفصلة.
[[kv_namespaces]]
binding = "UPTIME_STATE"
id = "f64f49cc48b54d23adfff9923be09dad"
