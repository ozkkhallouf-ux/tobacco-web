name: Deploy TOBACCO Web

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["توليد نشرات الأسعار"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run project check
        run: npm run check

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # النشرات تُولَّد هنا وقت النشر بدل رفعها بـ commit إلى main،
      # لأن حماية الفرع تمنع البوتات من الدفع المباشر (GH013).
      - name: Generate price list HTML
        run: node scripts/generate-price-lists.mjs

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Generate PDFs
        run: node scripts/generate-pdfs.mjs

      # ------------------------------------------------------------
      # حقن إعدادات مراقبة الأخطاء وقت النشر — لا رمز في المستودع إطلاقاً.
      #
      # index.html يحمل نوّاباً حرفيين (`__ROLLBAR_CLIENT_TOKEN__` وأخواه)،
      # وsrc/error-monitoring.js يعتبر أي قيمة تبدأ بـ`__` غيرَ مُهيّأة فيبقى
      # خاملاً. فالمستودع والنسخ المحلية بلا مراقبة، والموقع المنشور وحده
      # يحملها. رمز Rollbar من نوع post_client_item — صلاحيته الكتابة فقط
      # (إنشاء بلاغ)، ولا يقرأ شيئاً؛ وهو بحكم عمله ظاهر في HTML المنشور،
      # ولذلك تحديداً لا يجوز أن يكون رمزاً بصلاحية أوسع.
      #
      # بلا السرّ لا تفشل الخطوة: النائب يبقى مكانه فتبقى المراقبة معطّلة —
      # فالنشر لا يتوقف على تهيئة أداة رصد.
      #
      # كل قيمة من سياق GitHub تمرّ عبر env لا عبر ${{ }} داخل `run:` — نفس
      # التحصين المعتمَد على codex-review-gate.yml في 9637505: الحقن النصي
      # يجعل القيمة جزءاً من نصّ الصدفة قبل تنفيذه، فتُقرأ أمراً لا بياناً.
      # github.sha ليس مُتحكَّماً به هنا، لكن القاعدة تبقى واحدة في الملف كله.
      - name: Inject error monitoring configuration
        env:
          ROLLBAR_CLIENT_TOKEN: ${{ secrets.ROLLBAR_POST_CLIENT_ITEM_TOKEN }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          FILE="index.html"
          if [ -z "$ROLLBAR_CLIENT_TOKEN" ]; then
            echo "::notice::ROLLBAR_POST_CLIENT_ITEM_TOKEN غير مُعرَّف — مراقبة الأخطاء تبقى معطّلة في هذه النشرة."
            exit 0
          fi
          # النوّاب يجب أن تكون موجودة فعلاً؛ غيابها يعني أن index.html تغيّر
          # وأن الحقن صار صامتاً بلا أثر — وهو أسوأ من فشل صريح.
          grep -q '__ROLLBAR_CLIENT_TOKEN__' "$FILE"
          grep -q '__DEPLOY_ENVIRONMENT__' "$FILE"
          grep -q '__DEPLOY_COMMIT__' "$FILE"
          # الاستبدال بـpython لا بـsed: الرمز قيمة عشوائية قد تحمل / أو & أو
          # \1، وكلها ذات معنى خاص في sed فتفسد الناتج بصمت. python يستبدل نصاً
          # حرفياً. والرمز يصل عبر البيئة لا عبر سطر الأوامر ولا عبر ملف مؤقّت:
          # لا يظهر في قائمة العمليات ولا يُكتب على قرص العدّاء إطلاقاً.
          python3 - "$FILE" "$DEPLOY_COMMIT" <<'PYEOF'
          import html, os, pathlib, sys
          html_path, commit = sys.argv[1], sys.argv[2]
          token = os.environ["ROLLBAR_CLIENT_TOKEN"]
          # الرمز يُكتب داخل سمة HTML بين علامتَي اقتباس: الهروب إلزامي كي لا
          # تُنهي قيمةٌ فيها " أو < السمةَ فتُنتج صفحة مشوّهة. getAttribute في
          # المتصفح يفكّ الهروب تلقائياً، فالقيمة تصل إلى الشيفرة كما هي.
          p = pathlib.Path(html_path)
          s = p.read_text(encoding="utf-8")
          s = s.replace("__ROLLBAR_CLIENT_TOKEN__", html.escape(token, quote=True))
          s = s.replace("__DEPLOY_ENVIRONMENT__", "production")
          s = s.replace("__DEPLOY_COMMIT__", html.escape(commit, quote=True))
          p.write_text(s, encoding="utf-8")
          PYEOF
          # تحقّق بعدي: لم يبقَ نائب واحد، والرمز نفسه لا يُطبع أبداً.
          ! grep -q '__ROLLBAR_CLIENT_TOKEN__\|__DEPLOY_ENVIRONMENT__\|__DEPLOY_COMMIT__' "$FILE"
          echo "تمّ حقن إعدادات مراقبة الأخطاء (release=$DEPLOY_COMMIT)."

      # رقم النسخة يزداد مع رقم التشغيل كي يبقى تصاعدياً بلا commit
      - name: Bump service worker cache version
        run: |
          FILE="public/service-worker.js"
          CURRENT=$(grep -o 'v[0-9]*"' "$FILE" | tr -d '"v')
          NEW=$((CURRENT + ${{ github.run_number }}))
          sed -i "s/v${CURRENT}\"/v${NEW}\"/" "$FILE"

      # نفس المنطق لمعامل نسخة الأصول في index.html. بدونه تبقى عناوين الأصول
      # ثابتة بين النشرات (`src/app.js?v=tobacco-177`)، ومفتاح كاش HTTP يشمل
      # الاستعلام، وGitHub Pages يرسل max-age=600 — فيخدم المتصفح ملفات قديمة
      # حتى عشر دقائق بعد كل نشر. كان الرقم يُرفع يدوياً ونُسي في #159 و#160
      # و#161 معاً، فوصل المستخدمين تصدير نشرة بكود ما قبل الإصلاح.
      # الرفع هنا يجعل كل نشر يغيّر كل عنوان أصل: تحديث فوري بطلب واحد، بلا
      # إعادة تحقق شرطية على كل ملف وبلا لمس معالج fetch.
      - name: Bump asset version marker
        run: |
          FILE="index.html"
          CURRENT=$(grep -o 'v=tobacco-[0-9]*' "$FILE" | head -1 | sed 's/v=tobacco-//')
          # معامل مفقود يجعل CURRENT فارغاً فيتحوّل الاستبدال إلى مطابقة عمياء
          test -n "$CURRENT"
          NEW=$((CURRENT + ${{ github.run_number }}))
          sed -i "s/v=tobacco-${CURRENT}/v=tobacco-${NEW}/g" "$FILE"
          # الحدّ الرقمي `([^0-9]|$)` إلزامي في التحققين: بدونه يطابق البحث عن
          # القديم داخلَ الجديد حين يكون سابقةً له. مثال حقيقي: CURRENT=177 مع
          # run_number=1593 يعطي NEW=1770، فيجد `grep -c "v=tobacco-177"` ستة
          # مواضع داخل `v=tobacco-1770` رغم نجاح الاستبدال تماماً — فيفشل النشر
          # لعشر نشرات متتالية (run_number من 1593 إلى 1602). أُعيد إنتاجه فعلياً.
          test "$(grep -cE "v=tobacco-${NEW}([^0-9]|$)" "$FILE")" -gt 0
          test "$(grep -cE "v=tobacco-${CURRENT}([^0-9]|$)" "$FILE")" -eq 0
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # المحاولة الأولى — لا نُفشل الوظيفة فوراً كي نعيد المحاولة عند عثرة GitHub المؤقتة
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # عند فشل مؤقّت («Deployment failed, try again later») ننتظر قليلاً ثم نعيد المحاولة مرة واحدة
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
