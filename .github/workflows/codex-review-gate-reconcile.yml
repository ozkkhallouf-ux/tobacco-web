name: Codex Review Gate — مصالحة دورية مضمونة

# ⚠️ إصلاح جوهري حادي عشر بتاريخ 2026-09-01 (Pattern A، بتكليف صريح من المستخدم بعد
#   رفض P1 #1 وP1 #2 اللذين رصدهما Codex حياً على PR #170 — راجع تعليق "إصلاح جوهري حادي
#   عشر" في scripts/codex-review-gate-logic.mjs للتفاصيل الكاملة).
#
#   الفرق الجوهري عن codex-review-gate.yml (المسار السريع المُطلَق بالأحداث): هذا الملف
#   لا يعتمد على أي حدث لاحق إطلاقاً. يعمل كل ٥ دقائق بلا شرط، ويُعيد اشتقاق الحقيقة من
#   الصفر في كل دورة من الحالة الحية فقط (head.sha الحيّ للـPR + مراجعة Codex عليه) — لا
#   generation ولا حالة check-run موجودة تُستخدَم كمصدر حقيقة إطلاقاً. هذا يضمن أن أي
#   حالة خاطئة عالقة (سباق إنشاء، PATCH متأخر، أو أي انحراف آخر) تُصحَّح خلال ٥ دقائق
#   كحدّ أقصى، بصرف النظر عن سبب الخطأ ودون انتظار أي push/تعليق/مراجعة لاحقة.
#
#   قرار متعمَّد (شرط رابع صريح من المستخدم): لا PATCH إلا على check-run *موجود فعلاً* —
#   لا POST من هذا الملف إطلاقاً. راجع التبرير الكامل في تعليق "إصلاح جوهري حادي عشر" في
#   scripts/codex-review-gate-logic.mjs. بإيجاز: pull_request_target يضمن إنشاء أول
#   check-run فور فتح/تحديث أي PR، فلا حاجة لمسار إنشاء بديل هنا، وإنشاء واحد من مسار كود
#   مختلف قد يغطي PR لم يُقصد تغطيته أصلاً.
#
#   هذا الملف عمداً bash/jq خالص بلا أي actions/checkout لكود الفرع — نفس وضع التحصين
#   الموثّق في codex-review-gate.yml (schedule يُطلِق دوماً نسخة الملف من الفرع الافتراضي،
#   فحدود الثقة نفسها تنطبق: لا تنفيذ لأي كود يأتي من فرع PR).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  reconcile:
    name: مصالحة كل PR مفتوح (كل ٥ دقائق)
    runs-on: ubuntu-latest
    steps:
      - name: إعادة اشتقاق الحقيقة من الحالة الحية لكل PR مفتوح وتصحيح ما يلزم
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CODEX_BOT_LOGIN: chatgpt-codex-connector[bot]
          CHECK_NAME: Codex Review Gate
        run: |
          set -euo pipefail

          PR_NUMBERS=$(gh api "repos/$REPO/pulls" -f state=open -f per_page=100 --paginate --jq '.[].number')

          if [ -z "$PR_NUMBERS" ]; then
            echo "لا توجد طلبات سحب مفتوحة — لا شيء للمصالحة."
            exit 0
          fi

          for PR_NUMBER in $PR_NUMBERS; do
            echo "=== PR #$PR_NUMBER ==="

            # شرط سادس: تحقّق فوري أن الـPR ما زال مفتوحاً ولم يُدمج قبل أي عمل عليه.
            PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
            PR_STATE=$(echo "$PR_JSON" | jq -r '.state // empty')
            PR_MERGED=$(echo "$PR_JSON" | jq -r '.merged // false')
            if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" = "true" ]; then
              echo "  متخطى: الحالة=$PR_STATE مدموج=$PR_MERGED — لا كتابة."
              continue
            fi

            LIVE_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha // empty')
            if [ -z "$LIVE_HEAD_SHA" ]; then
              echo "  متخطى: تعذّرت قراءة head.sha الحيّ."
              continue
            fi

            # شرط ثانٍ: اشتقاق الحقيقة من الحالة الحية فقط — نفس المصادر الثلاثة التي
            # تعتمدها evaluateCodexReview في codex-review-gate.yml (مراجعات رسمية، تعليقات
            # مراجعة، تعليقات issue)، مُعاد تطبيقها هنا حرفياً لأن هذا الملف عمداً bash/jq
            # خالص بلا actions/checkout. لا يُطبَّق fallback السلفية-بدمج-فقط هنا عمداً:
            # أي merge commit يُضاف للـPR هو push فعلي، يُطلِق synchronize فوراً على المسار
            # السريع — فلا فجوة ضمان تحتاج تغطية هنا لتلك الحالة تحديداً.
            REVIEWS_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate)
            FORMAL_REVIEW_COUNT=$(echo "$REVIEWS_JSON" | jq --arg sha "$LIVE_HEAD_SHA" --arg bot "$CODEX_BOT_LOGIN" \
              '[.[] | select(.user.login == $bot and .commit_id == $sha)] | length')

            COMMENTS_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate)
            REVIEW_COMMENT_COUNT=$(echo "$COMMENTS_JSON" | jq --arg sha "$LIVE_HEAD_SHA" --arg bot "$CODEX_BOT_LOGIN" \
              '[.[] | select(.user.login == $bot and .original_commit_id == $sha)] | length')

            ISSUE_COMMENTS_JSON=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate)
            HEAD_SHA_LC=$(echo "$LIVE_HEAD_SHA" | tr '[:upper:]' '[:lower:]')
            ISSUE_COMMENT_MATCH=$(echo "$ISSUE_COMMENTS_JSON" | jq -r --arg bot "$CODEX_BOT_LOGIN" --arg headlc "$HEAD_SHA_LC" '
              [.[] | select(.user.login == $bot) |
                (.body | [scan("Reviewed commit:\\*\\*\\s*`([0-9a-fA-F]{7,40})`")] | map(.[0] | ascii_downcase)) as $shas |
                select(($shas // []) | any(. as $s | $headlc | startswith($s)))
              ] | length > 0')

            REVIEWED_COUNT=$((FORMAL_REVIEW_COUNT + REVIEW_COMMENT_COUNT))
            if [ "$ISSUE_COMMENT_MATCH" = "true" ]; then
              REVIEWED_COUNT=$((REVIEWED_COUNT + 1))
            fi
            HAS_VALID_REVIEW=$([ "$REVIEWED_COUNT" -gt 0 ] && echo true || echo false)
            echo "  head_sha=$LIVE_HEAD_SHA reviewed_count=$REVIEWED_COUNT has_valid_review=$HAS_VALID_REVIEW"

            # شرط رابع: لا POST إطلاقاً — نقرأ فقط check-runs الموجودة فعلاً بهذا الاسم على
            # نفس head_sha الحيّ. غياب أي واحد يعني idsToPatch فارغة، فلا كتابة إطلاقاً.
            ALL_NAMED_RUNS_JSON=$(gh api "repos/$REPO/commits/$LIVE_HEAD_SHA/check-runs" --paginate --jq '.check_runs' | jq -s 'add // []' \
              | jq --arg name "$CHECK_NAME" '[.[] | select(.name == $name)]')

            IDS_TO_PATCH=$(echo "$ALL_NAMED_RUNS_JSON" | jq -r --argjson reviewed "$HAS_VALID_REVIEW" '
              ($reviewed) as $r |
              (if $r then "completed" else "in_progress" end) as $status |
              (if $r then "success" else null end) as $conclusion |
              [.[] | select(.status != $status or ((.conclusion // null) != $conclusion)) | .id] | .[]')

            if [ -z "$IDS_TO_PATCH" ]; then
              echo "  لا حاجة لأي PATCH — كل النسخ الموجودة (إن وُجدت) تطابق الحالة الصحيحة أصلاً."
              continue
            fi

            # شرط خامس: تحقّق فوري ثانٍ (حالة + head.sha معاً) مباشرة قبل أي كتابة فعلية —
            # إن تغيّر أي منهما منذ بداية هذه الدورة، لا كتابة إطلاقاً لهذا الـPR في هذه
            # الدورة (تُعاد المحاولة تلقائياً بعد ٥ دقائق على الحالة الحية الجديدة).
            RECHECK_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
            RECHECK_STATE=$(echo "$RECHECK_JSON" | jq -r '.state // empty')
            RECHECK_MERGED=$(echo "$RECHECK_JSON" | jq -r '.merged // false')
            RECHECK_HEAD_SHA=$(echo "$RECHECK_JSON" | jq -r '.head.sha // empty')
            if [ "$RECHECK_STATE" != "open" ] || [ "$RECHECK_MERGED" = "true" ] || [ "$RECHECK_HEAD_SHA" != "$LIVE_HEAD_SHA" ]; then
              echo "  الحالة أو الـHEAD تغيّرا قبل الكتابة (حالة=$RECHECK_STATE مدموج=$RECHECK_MERGED head=$RECHECK_HEAD_SHA) — لا كتابة إطلاقاً في هذه الدورة."
              continue
            fi

            if [ "$HAS_VALID_REVIEW" = "true" ]; then
              PAYLOAD=$(jq -n --arg name "$CHECK_NAME" '{name:$name, status:"completed", conclusion:"success", output:{title:$name, summary:"مصالحة دورية: مراجعة Codex صالحة موجودة على الـHEAD الحالي."}}')
              TARGET_LABEL="success"
            else
              PAYLOAD=$(jq -n --arg name "$CHECK_NAME" '{name:$name, status:"in_progress", output:{title:$name, summary:"مصالحة دورية: لا توجد مراجعة Codex صالحة على الـHEAD الحالي بعد."}}')
              TARGET_LABEL="in_progress"
            fi

            for ID in $IDS_TO_PATCH; do
              echo "  PATCH check-run $ID → $TARGET_LABEL"
              echo "$PAYLOAD" | gh api "repos/$REPO/check-runs/$ID" --method PATCH --input - >/dev/null
            done
          done
