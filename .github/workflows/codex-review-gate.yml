name: Codex Review Gate

# الغرض: يفرض أن يكون كل Pull Request إلى main قد راجعه فعلياً
# chatgpt-codex-connector[bot] على أحدث HEAD commit، قبل السماح بالدمج.
#
# آلية الفحص (بيانات GitHub API رسمية فقط، لا timestamps):
#   1. يقرأ head.sha الحالي للـPR وقت التشغيل نفسه (وليس من الـpayload المخزَّن).
#   2. يجلب pulls/{n}/reviews ويتحقق: هل يوجد review من chatgpt-codex-connector[bot]
#      حقله commit_id مطابق تماماً لـhead.sha الحالي؟
#   3. لا تطابق = فشل صريح (FAIL) يمنع الدمج عبر Required Status Check باسم "Codex Review Gate".
#   4. أي push جديد على نفس الـPR يُعيد تشغيل هذا الفحص من الصفر (trigger: synchronize)
#      فيسقط تلقائياً أي مراجعة قديمة لأن sha تغيّر.
#   5. أي مراجعة/تعليق جديد من Codex على نفس الـPR (trigger: pull_request_review,
#      pull_request_review_comment) يُعيد تشغيل الفحص أيضاً كي تتحول النتيجة إلى PASS
#      فور وصول مراجعة على الـHEAD الحالي، دون انتظار push جديد.
#
# ملاحظة مهمة عن P0/P1:
#   استخراج درجة الخطورة (P0/P1/P2/P3) من شارات shields.io داخل نص تعليقات Codex هو
#   إجراء "best-effort" معلوماتي فقط (يُعرض في ملخص الفحص) — ولا يُستخدم كمانع دمج أساسي،
#   لأنه يعتمد على تنسيق markdown غير موثّق رسمياً من OpenAI وقد يتغيّر دون إشعار.
#   منع الدمج مع ملاحظات مفتوحة يجب أن يعتمد على إعداد GitHub الرسمي
#   "Require conversation resolution before merging" في Branch Protection، لأنه يفرض حلّ
#   كل thread تعليق (بغض النظر عن درجته) عبر GraphQL isResolved الرسمي والموثوق.
#
# ⚠️ حماية من التلاعب (إصلاح ملاحظة Codex P1 بتاريخ 2026-08-27):
#   استُخدم `pull_request_target` بدلاً من `pull_request` عمداً. الفرق الحاسم:
#   - `pull_request` ينفّذ نسخة الـworkflow الموجودة في فرع الـPR نفسه — أي أن أي PR
#     يستطيع تعديل هذا الملف واستبدال منطق الفحص بـno-op ناجح بنفس اسم الـcheck،
#     فيتجاوز الـGate تماماً.
#   - `pull_request_target` ينفّذ دائماً نسخة الـworkflow من الفرع الافتراضي (main)
#     بغض النظر عمّا يحتويه فرع الـPR، فلا يمكن لأي PR (حتى لو عدّل هذا الملف نفسه)
#     تغيير منطق الفحص أو تعطيله.
#   قواعد صارمة لضمان الأمان مع `pull_request_target` (ملتزَم بها بالكامل هنا):
#     - ممنوع أي `actions/checkout` لكود الـPR في هذا الملف.
#     - ممنوع تشغيل أي script أو ملف قادم من فرع الـPR.
#     - كل البيانات المستخدمة تأتي حصراً من GitHub API الرسمي (pulls/{n}, reviews,
#       comments) — أرقام ومعرّفات ونصوص Metadata فقط، لا تنفيذ كود من الـPR إطلاقاً.
#     - اسم الفحص يبقى ثابتاً: "Codex Review Gate".
#
# ⚠️ إصلاح ملاحظة Codex P1 بتاريخ 2026-08-27 (fork/Dependabot PRs محجوبة دائماً):
#   GitHub يخفّض GITHUB_TOKEN إلى read-only في PRs القادمة من forks (وDependabot تحديداً)
#   بغض النظر عن `permissions: checks: write` المطلوبة هنا صراحة. سابقاً كانت نتيجة
#   الـGate تعتمد على نجاح استدعاء POST /check-runs لنشر check-run إضافي بنفس الاسم —
#   فإذا رجع هذا الاستدعاء 403 (حالة الـfork)، كان `set -e` يُفشل الـjob كاملاً حتى لو
#   كانت المراجعة نفسها موجودة وناجحة (REVIEWED_COUNT > 0)، فيُحجب PR مراجَع فعلياً
#   إلى الأبد. الإصلاح:
#     1. النتيجة المعتمدة الوحيدة للـGate هي نتيجة الـjob نفسه (الفحص المدمج تلقائياً
#        في تبويب Checks باسم الـjob "Codex Review Gate") — لا حاجة لأي check-run يُنشأ
#        يدوياً عبر API لتحديد PASS/FAIL.
#     2. نشر check-run باسم "Codex Review Gate" (الملتصق صراحة بـhead_sha الفعلي للـPR،
#        وهو الوحيد المضمون الالتصاق الصحيح لكل أنواع الأحداث — انظر تعليق الإصلاح
#        الثاني أدناه) خطوة best-effort صريحة: `continue-on-error: true`، ولا يوجد
#        `exit 1` بداخلها إطلاقاً — فشلها (403 مثلاً في fork/Dependabot) لا يُسقط الـjob.
#     3. خطوة أخيرة منفصلة هي من تقرر exit code النهائي للـjob نفسه (المدمج تلقائياً في
#        تبويب Checks)، بالاعتماد حصراً على `steps.check.outputs.conclusion` (نتاج فحص
#        مراجعة Codex)، بغض النظر تماماً عن نجاح أو فشل نشر الـcheck-run أعلاه (403 أو غيره).
#     ⚠️ ملاحظة صادقة: على fork/Dependabot PR حقيقي (GITHUB_TOKEN للقراءة فقط)، خطوة
#        النشر (٢) قد تفشل بـ403 فلا يظهر أي check باسم "Codex Review Gate" ملتصق بـ
#        head_sha الصحيح على الإطلاق — يبقى فقط الـcheck التلقائي للـjob (المحتمل التصاقه
#        بـsha مختلف حسب دلالة GITHUB_SHA لكل حدث). هذا قيد فعلي في صلاحيات GITHUB_TOKEN
#        لا يمكن تجاوزه إلا باستخدام App/PAT بصلاحية كتابة — خارج نطاق هذا الإصلاح.
#
# ⚠️ إصلاح جوهري خامس بتاريخ 2026-08-31 (Canonical Check Run واحد لكل PR+HEAD SHA):
#   الإصلاح الرابع (فصل concurrency group حسب نوع الحدث، أدناه) أوقف الإلغاء الخاطئ بين
#   pull_request_target وissue_comment، لكنه كشف عن ثغرة أعمق رصدها Codex نفسه كـP1 حي على
#   PR #146: كل تشغيل مستقل كان يُنشئ check-run **منفصلاً** جديداً عبر POST /check-runs
#   بنفس الاسم "Codex Review Gate" على نفس head_sha. فإذا اكتمل تشغيل قديم (لا مراجعة بعد
#   وقته ⇒ FAIL شرعي حينها) بعد تشغيل أحدث (وجد مراجعة ⇒ PASS)، يتعايش الاثنان معاً على
#   نفس الـsha، ويُقيّم rollup/ruleset الحالة الإجمالية FAILURE رغم أن الأصح والأحدث PASS.
#   المشكلة الجذرية: عدة check-runs بنفس الاسم على نفس sha — الـruleset لا يأخذ "آخرها فقط".
#
#   الحل: check-run كانوني واحد فقط لكل زوج (PR, head_sha) — مصدر الحقيقة الوحيد:
#     1. كل تشغيل يبحث أولاً عن check-run موجود فعلاً بنفس الاسم على نفس head_sha بالضبط
#        (GET /commits/{sha}/check-runs?check_name=Codex Review Gate).
#     2. وُجد ⇒ PATCH لنفس الـid (تحديث في مكانه) — لا يُنشأ أبداً check-run ثانٍ بنفس الاسم
#        على نفس sha مهما تعدّدت التشغيلات (فتح PR، تعليق مراجعة، إلخ) على نفس الـHEAD.
#     3. لم يوجد (أول تشغيل لهذا الـsha، أو sha جديد بعد push) ⇒ POST لإنشاء check-run جديد
#        بحالة `in_progress`.
#     4. لا توجد مراجعة بعد ⇒ الحالة تبقى `in_progress` (pending) — **ليست** `failure`.
#        هذا يمنع الدمج بنفس فعالية الفشل الصريح (required status check غير success)، لكن
#        دون احتمال أن ينشر تشغيل قديم "فشلاً" لاحقاً يلوّث الـrollup — فما دام لا يوجد سوى
#        check-run واحد قابل للتحديث في مكانه، لا يوجد "قديم" يتنافس مع "جديد" إطلاقاً.
#     5. مراجعة صريحة على نفس الـHEAD ⇒ يُحدَّث نفس الـcheck-run الكانوني إلى
#        `completed`/`success`.
#     6. push جديد (HEAD SHA مختلف، حتى لو كان الـsha السابق success) ⇒ لا يوجد check-run
#        بعد لهذا الـsha الجديد تحديداً ⇒ ينشأ check-run كانوني جديد بحالة `in_progress`
#        تلقائياً بلا أي منطق خاص، لأن البحث دائماً بـhead_sha الحالي حصراً.
#   منطق البحث/البناء موثَّق ومختبَر آلياً في codex-review-gate-logic.mjs
#   (selectCanonicalCheckRunId + buildCanonicalCheckRunPayload) +
#   check-codex-review-gate-logic.mjs — جزء من npm run check.
#
# ⚠️ إصلاح جوهري سابع بتاريخ 2026-08-31 (حارس تشغيل قديم صريح — race condition حقيقي رصدها Codex كـP1):
#   بعد الإصلاحين الخامس والسادس، رصد Codex نفسه P1 حياً على PR #146 (thread غير محلول
#   وغير outdated): تقسيم concurrency حسب github.event_name (الإصلاح الرابع أدناه) يسمح
#   بتشغيلات متزامنة فعلية لنفس (PR, HEAD) — مثلاً pull_request_target عند فتح الـPR
#   وissue_comment عند "@codex review" يمكن أن يبدآ معاً. منطق الإصلاح الخامس (PATCH في
#   مكانه بدل POST جديد) يمنع تعدد check-runs بنفس الاسم، لكنه **غير ذري**: بحث ثم كتابة
#   (lookup-then-write) — إن بدأ تشغيل قديم (لا مراجعة بعد وقته) قبل تشغيل أحدث (وجد
#   مراجعة) لكنه انتهى ونفّذ PATCH بعده، يكتب "in_progress" فوق "success" الأحدث — تراجُع
#   فعلي (regression) في نتيجة الـGate رغم عدم وجود أي check-run مكرر.
#
#   الحل ثلاثي الطبقات (دفاع متعدد الطبقات، لا يعتمد على ترتيب وصول الأحداث وحده):
#     1. توحيد concurrency: مفتاح المجموعة أصبح برقم الـPR فقط (بلا github.event_name) —
#        كل تشغيلات نفس الـPR بمجموعة واحدة، فتُلغي (cancel-in-progress) أي تشغيل سابق ما
#        زال قائماً عند وصول تشغيل جديد. هذا يقلّص التداخل الفعلي كثيراً لكنه ليس ضماناً
#        تاماً (نافذة زمنية قصيرة ممكنة بين إشارة الإلغاء واكتمال استدعاء API الجاري فعلاً).
#     2. إعادة قراءة head.sha الحيّ للـPR مباشرة قبل أي كتابة نهائية (وليس فقط في بداية
#        التشغيل): إن تغيّر (push جديد وصل أثناء تنفيذ هذا التشغيل تحديداً) فهذا التشغيل لم
#        يعد يخص أحدث HEAD إطلاقاً — يخرج بلا أي كتابة، مهما كانت نتيجته المحسوبة سابقاً.
#     3. حارس تشغيل قديم صريح (stale-run guard) عبر حقل `external_id` الرسمي في check-run:
#        كل تشغيل يحمل "generation" فريدة تصاعدية = `github.run_id`.`github.run_attempt`
#        (GitHub يخصّص run_id تصاعدياً وقت إنشاء التشغيل نفسه — لا علاقة له بترتيب
#        الاكتمال). قبل أي PATCH/POST نهائي، يُقرأ external_id للـcheck-run الكانوني
#        الموجود حالياً (إن وُجد): إن كانت قيمته (generation تشغيل سابق) أحدث من أو تساوي
#        generation هذا التشغيل ⇒ هذا التشغيل قديم/متأخر بالتعريف (بغض النظر عن ترتيب وصول
#        الأحداث أو نتيجة السباق مع الإلغاء) ⇒ يخرج بلا كتابة. كل كتابة ناجحة تُثبّت
#        generation نفسها في external_id، فتصبح الحماية تراكمية عبر كل التشغيلات اللاحقة.
#   هذا يضمن monotonicity صريحة: لا يمكن لأي تشغيل ذي generation أقدم أن يكتب فوق نتيجة
#   تشغيل ذي generation أحدث، بصرف النظر تماماً عن ترتيب الاكتمال الفعلي على الشبكة.
#   منطق runGeneration/isStaleWrite/isStaleHead موثَّق ومختبَر آلياً في
#   codex-review-gate-logic.mjs + check-codex-review-gate-logic.mjs (جزء من npm run check).
#
# ⚠️ إصلاح جوهري سادس بتاريخ 2026-08-31 (تصادم اسم الـjob التلقائي مع الـcheck-run الكانوني):
#   بعد نشر الإصلاح الخامس، تحقّق حي على PR #146 (commit 7dadfbf) أظهر أن rollup ما زال
#   يحوي 3 سياقات منفصلة باسم "Codex Review Gate" على نفس head_sha رغم الـdedup، بل وconclusion
#   حرفي failure. السبب الجذري الحقيقي (وليس الافتراض القديم أعلاه): GitHub Actions ينشئ
#   check-run **تلقائياً** لكل تشغيل job، باسم `jobs.gate.name` — وكان مضبوطاً حرفياً
#   "Codex Review Gate"، أي نفس اسم الـcheck-run الذي ننشره/نُحدّثه يدوياً عبر API. تبيّن أن
#   هذا الـcheck التلقائي **يلتصق فعلاً بـhead_sha الحقيقي للـPR** لأحداث pull_request_review
#   وpull_request_review_comment وpull_request_target — عكس الافتراض المدوَّن في تعليق
#   "إصلاح ملاحظة Codex P1 بتاريخ 2026-08-27" أعلاه. النتيجة: كل تشغيل مستقل (وقد عمل Codex
#   على نفس الـHEAD بأكثر من حدث دفعة واحدة: pull_request_review + pull_request_review_comment
#   ×2 خلال ثوانٍ) يُنتج check-run تلقائياً **إضافياً** بنفس الاسم، مستقل تماماً عن منطق
#   الـdedup اليدوي (الذي يُدير check-run واحداً فقط من صنعه هو، لا يستطيع التحكم بما ينشئه
#   GitHub تلقائياً للـjob نفسه). فتراكمت 3 سياقات "Codex Review Gate" (اثنان تلقائيان + واحد
#   يدوي)، والـruleset (الذي يطلب حرفياً context باسم "Codex Review Gate") يأخذها جميعاً.
#   الحل: تغيير `jobs.gate.name` إلى اسم مختلف عمداً (أدناه) حتى لا يتصادم الـcheck التلقائي
#   إطلاقاً مع اسم الـcheck-run الكانوني المُدار يدوياً — الأخير فقط يبقى مطابقاً حرفياً
#   لاسم required status check "Codex Review Gate" في الـruleset (تحقَّق فعلياً عبر
#   `gh api repos/.../rules/branches/main`)، فلا مصدر آخر يزاحمه في نفس الاسم بعد الآن.
#
#   إصلاح إضافي مكتشَف بنفس الفحص الحي: خطوة البحث كانت تستخدم
#   `gh api ".../check-runs" -f check_name="Codex Review Gate" --paginate` — واتضح أن `gh api`
#   يُرجع 404 خاطئاً تحديداً مع تركيبة `-f` وقيمة تحوي مسافة + `--paginate` معاً (مؤكَّد يدوياً:
#   نفس الطلب بدون `-f check_name` أو عبر query string مباشرة يرجع 200 بنجاح). الحل: إزالة
#   `-f check_name` نهائياً وتصفية النتائج بالاسم عبر jq بعد الجلب بدل الاعتماد على فلترة
#   الخادم — يتجنب هذا الخلل في `gh api` تماماً، وأصبح غير ضروري أصلاً بعد إصلاح تصادم الاسم.
#
# ⚠️ إصلاح جوهري بتاريخ 2026-08-29 (الـartifact الحقيقي الذي ينشره Codex ليس Formal Review):
#   تحقق حي على PR #128 أثبت أن chatgpt-codex-connector[bot] لا ينشر نتيجته كـ
#   Pull Request Review (لا يظهر إطلاقاً في GET /pulls/{n}/reviews) ولا كـReview Comment
#   (GET /pulls/{n}/comments) — بل كـ**Issue Comment عادي** عبر
#   POST /issues/{n}/comments، بنص يتضمن حرفياً السطر:
#     **Reviewed commit:** `<short-sha>` (10 خانات hex عادةً، أحياناً أقل/أكثر)
#   الحل: يُضاف مصدر ثالث للفحص (GET /issues/{n}/comments) بجانب المصدرين السابقين
#   (يبقيان لضمان التوافق إذا غيّر Codex سلوكه مستقبلاً لمراجعة رسمية):
#     - المؤلف يجب أن يكون بالضبط chatgpt-codex-connector[bot].
#     - يُستخرج الـshort-sha من نص "Reviewed commit:" حصراً عبر regex صارم
#       (Reviewed commit:\*\*\s*`[0-9a-fA-F]{7,40}`) — لا أي استدلال آخر من النص الحر.
#     - المطابقة تكون بأن يبدأ head_sha الحالي (40 خانة) حرفياً بهذا الـshort-sha
#       (مقارنة prefix، case-insensitive) — وليس بالتساوي التام لأن Codex ينشر short-sha
#       لا الـsha الكامل. تصادم prefix بين commit مختلف وHEAD الحالي مستبعد عملياً لأي
#       طول ≥ 7 خانات hex.
#     - لا اعتماد إطلاقاً على created_at/timestamp لتحديد الحداثة — المطابقة فقط عبر
#       محتوى commit المذكور صراحة داخل الجسم مقابل head_sha المجلوب حيّاً من API.
#     - تعليق قديم يذكر sha لا يطابق head_sha الحالي (لأن push جديد غيّر الـsha) لا يُحتسب
#       أبداً، فيبقى الفحص FAIL تلقائياً بعد أي push جديد حتى تصل مراجعة Codex على
#       الـHEAD الجديد تحديداً — بلا أي استثناء.
#
# ⚠️ إصلاح جوهري ثالث بتاريخ 2026-08-31 (ثغرة إعادة ربط commit_id تلقائياً بعد rebase):
#   PR #139 دُمج بالاعتماد على REVIEW_COMMENT_COUNT>0، لكن التحقق اللاحق أظهر أن التطابق
#   لم يكن على مراجعة فعلية لـHEAD الدمج، بل لأن GitHub يعيد ربط حقل commit_id في
#   pulls/{n}/comments تلقائياً بأي commit لاحق ما زال يحتوي نفس سطر الكود دون تغيير —
#   أي أن rebase أو merge لا يمسّان تلك الأسطر يجعل تعليق مراجعة قديم "يبدو" وكأنه على
#   الـHEAD الجديد رغم أن Codex لم يرَ هذا الـHEAD إطلاقاً. الحقل الثابت أبداً بعد الإنشاء
#   هو original_commit_id (لا يُعاد ربطه مهما تحرك تاريخ الفرع لاحقاً) — هو من يُستخدم
#   الآن حصراً لمطابقة pulls/{n}/comments، بدلاً من commit_id القابل لإعادة الربط.
#   مراجعات pulls/{n}/reviews (Formal Review) بقيت تُطابَق عبر commit_id لأن حقلها يُثبَّت
#   وقت الإرسال ولا يرتبط بسطر كود متحرك، فلا ثغرة إعادة ربط هناك أصلاً. مطابقة
#   issues/{n}/comments (نص "Reviewed commit:") لم تتغيّر لنفس السبب — محتوى ثابت كتبه
#   Codex فعلياً. المنطق موثَّق ومختبَر بشكل قابل للتكرار الآلي في
#   scripts/codex-review-gate-logic.mjs + scripts/check-codex-review-gate-logic.mjs
#   (سيناريوهان: مراجعة قديمة + rebase بدون تغيير السطر ⇒ FAIL؛ مراجعة جديدة فعلية على
#   الـHEAD الحالي ⇒ PASS) — جزء من npm run check.
#
# ⚠️ إصلاح جوهري ثانٍ بتاريخ 2026-08-29 (الفحص لا يُعاد تلقائياً عند وصول Issue Comment):
#   بعد إضافة مصدر Issue Comment أعلاه، تحقق حي على PR #128 أظهر أن الـGate بقيت FAIL
#   حتى بعد نشر Codex لمراجعة صالحة على الـHEAD الحالي، لأن أحداث تشغيل الـworkflow
#   (`on:`) لم تكن تتضمن `issue_comment` إطلاقاً — فمجرد وصول تعليق Codex (وهو الـartifact
#   الفعلي المُستخدَم غالباً) لا يُطلق أي تشغيل جديد للفحص، ويبقى الفحص عالقاً على آخر
#   نتيجة من push سابق حتى push جديد أو تشغيل يدوي. الحل: إضافة `issue_comment: [created]`
#   كحدث تشغيل، مع:
#     - تجاهل صريح لأي تعليق ليس على Pull Request (لا يحمل `issue.pull_request`).
#     - استخراج رقم الـPR من `github.event.issue.number` لهذا المسار تحديداً.
#     - `base_ref` لهذا المسار يُجلب حصراً من GitHub API (`pulls/{n}.base.ref`) وليس من
#       الـpayload، لأن حدث `issue_comment` لا يحمل معلومات الـbase أصلاً.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "رقم الـPR لإعادة الفحص يدوياً"
        required: true

permissions:
  # ⚠️ إصلاح جوهري ثاني عشر بتاريخ 2026-08-31: contents: write مطلوبة لدفع (push) commit
  # القفل الذرّي إلى refs/gate-lock/pr-<PR_NUMBER> — انظر شرح الإصلاح الثاني عشر أدناه.
  # على fork/Dependabot PR حقيقي، GitHub يخفّض GITHUB_TOKEN إلى قراءة فقط بصرف النظر عن
  # هذا الإعداد (تحصين GitHub نفسه لـpull_request_target) — نفس القيد الموثَّق سابقاً
  # لـcheck-run POST، والسلوك عند الفشل هنا best-effort مطابق تماماً (انظر أدناه).
  contents: write
  pull-requests: read
  checks: write

# ⚠️ إصلاح جوهري رابع بتاريخ 2026-08-31 (فصل concurrency group حسب نوع الحدث) — مُلغى
  #   ومُستبدَل بالإصلاح السابع أعلى الملف. تم إبقاء هذا الشرح لسجل القرار فقط:
  #   لوحظ حياً على PR #146 أن فتح الـPR (pull_request_target) وتعليق "@codex review"
  #   (issue_comment) كانا يقعان في نفس مجموعة concurrency فيُلغي الثاني الأول. الحل وقتها
  #   كان فصل المجموعة حسب github.event_name. لكن هذا الفصل بالذات هو ما فتح نافذة
  #   التشغيلات المتزامنة الفعلية التي كشفها Codex كـP1 (race condition في الكتابة على
  #   check-run الكانوني — انظر "إصلاح جوهري سابع" أعلى الملف). الإصلاح السابع يعيد توحيد
  #   المجموعة عمداً، ويعتمد بدلاً من ذلك على حارس تشغيل قديم صريح (stale-run guard) لمنع
  #   أي تراجع في النتيجة — وليس على فصل concurrency الذي أثبت أنه غير كافٍ وحده.
  #
  # ⚠️ إصلاح جوهري عاشر بتاريخ 2026-08-31 (إيقاف cancel-in-progress — يلوّث statusCheckRollup):
  #   رُصد حياً على PR #150 بعد دمج #146: push ثانٍ على نفس الـPR يُلغي (CANCELLED) تشغيل
  #   الـjob السابق كاملاً، بما فيه check-run الـjob التلقائي "Codex Review Gate (تشغيل
  #   داخلي — ليس Required Check)"، فيصبح conclusion الخاص به CANCELLED. هذا الاسم ليس
  #   ضمن required_status_checks (["Codex Review Gate","check","validate"]) ولا يمنع الدمج
  #   (mergeable يبقى MERGEABLE)، لكنه يلوّث الحساب الكلي لـstatusCheckRollup/mergeStateStatus
  #   على مستوى GitHub نفسه (كل check-runs على الـcommit تدخل بالحساب الكلي بصرف النظر عن
  #   عضويتها بالـrequired list)، فيصير UNSTABLE بدل CLEAN رغم أن كل الفحوصات المطلوبة PASS.
  #   لا يمكن فصل orchestration هذا الـjob عن رول-أب الـPR بالكامل: كل job في GitHub Actions
  #   ينشئ check-run تلقائياً حتماً، ولا آلية لإخفائه؛ ونقله لworkflow منفصل يعيد بالضبط
  #   سباق التشغيلات المتزامنة الذي أغلقه الإصلاح السابع عمداً بتوحيد concurrency group.
  #   الحل هنا إذن هو الخيار الآمن المتاح: السماح للتشغيل الأقدم بأن *يُكمل* بدل أن يُقتل في
  #   منتصف التنفيذ. حارس HEAD الحي (isStaleHead) في خطوة "publish" أدناه يُعيد قراءة
  #   head.sha الحيّ قبل أي كتابة نهائية ويخرج exit 0 (بلا أي كتابة) إن لم يعد يطابق الـHEAD
  #   الذي بدأ عليه التشغيل — أي أن تشغيلاً قديماً مسموحاً له بالإكمال يُنهي job بنجاح دائماً
  #   (SUCCESS)، لا CANCELLED ولا FAILURE، بصرف النظر عن نتيجة الـGate الكانوني. وحارسا
  #   isStaleWrite/needsWriteReconciliation (الإصلاحان السابع والثامن) يبقيان الضامنين
  #   لصحة نتيجة check-run الكانوني نفسه بصرف النظر عن ترتيب اكتمال التشغيلات — فتعطيل
  #   cancel-in-progress هنا لا يُعيد أي سباق قديم كان قد أُغلق، فقط يمنع القتل الذي يُنتج
  #   CANCELLED الظاهر في الـrollup.
  #
  # ⚠️ إصلاح جوهري حادي عشر بتاريخ 2026-08-31 (حذف concurrency نهائياً — ملاحظة Codex P1
  #   على PR #151، thread غير محلول): الإصلاح العاشر أعلاه (cancel-in-progress: false) يحمي
  #   فقط تشغيلاً *قيد التنفيذ فعلاً* (in_progress) من القتل. لكن دلالة GitHub الرسمية لأي
  #   concurrency group تسمح بعضو واحد "قيد التنفيذ" وعضو واحد فقط "قيد الانتظار" (pending)
  #   في آنٍ معاً: إن وصل حدث ثالث لنفس الـPR بينما يوجد عضو قيد تنفيذ وآخر قيد انتظار، يُلغى
  #   العضو "قيد الانتظار" (وليس المُنفَّذ) فوراً ليحل الحدث الثالث محله — بصرف النظر تماماً
  #   عن قيمة cancel-in-progress، لأن هذا السلوك خاص حصراً بعضو الانتظار لا العضو المُنفَّذ.
  #   تشغيل أُلغي وهو "قيد الانتظار" لم يبدأ تنفيذ أي خطوة إطلاقاً، فحارس isStaleHead (الذي
  #   يعمل داخل خطوة "publish" أثناء التنفيذ) لا يُتاح له فرصة العمل، ويظهر check-run الـjob
  #   التلقائي بحالة CANCELLED تماماً كما كان قبل الإصلاح العاشر — ثغرة أثبتها Codex حياً على
  #   PR #151 نفسه (راجع نص المراجعة في الـPR).
  #   الحل النهائي: حذف قيد concurrency هنا بالكامل. هذا يزيل آلية "عضو منتظر واحد فقط" من
  #   الأساس فلا يوجد أي تشغيل يُلغى عبر طابور GitHub إطلاقاً — كل التشغيلات تبدأ وتُكمل
  #   بحرية تامة بالتوازي إن لزم. هذا آمن تماماً لأن ضمانات monotonicity (الإصلاح السابع:
  #   generation تصاعدية عبر external_id) وتوحيد إنشاء check-run الأول (الإصلاح الثامن:
  #   "توحيد نسخة check-run مكرر") موثَّقتان صراحةً في تعليقاتهما بأنهما "بصرف النظر تماماً
  #   عن ترتيب الاكتمال الفعلي على الشبكة" — أي مصمَّمتان أصلاً لتحمُّل تشغيلات متزامنة حقيقية
  #   لا لمجرد إعادة ترتيب طابور متسلسل. الكلفة الوحيدة: استهلاك أكبر لدقائق CI عند تدفق
  #   أحداث كثيف على نفس الـPR (بلا حد أقصى لعدد التشغيلات المتوازية) — مقبول مقابل ضمان عدم
  #   ظهور أي CANCELLED في statusCheckRollup مطلقاً بسبب طابور concurrency، وهذا الهدف
  #   الصريح للإصلاحين العاشر والحادي عشر معاً.
  #   لا تعديل على اسم أو منطق Required Check "Codex Review Gate" — القيد المحذوف هنا هو
  #   قيد orchestration داخلي بحت، غير مذكور في required_status_checks إطلاقاً.
  #
  # ⚠️ إصلاح جوهري ثاني عشر بتاريخ 2026-08-31 (قفل ذرّي حقيقي عبر git ref — يستبدل
  #   الإصلاحين العاشر والحادي عشر بالكامل، ويردّ على P1 حيّين إضافيين رصدهما Codex على
  #   PR #151 نفسه بعد الإصلاح الحادي عشر):
  #
  #   P1 الأول ("Prevent cancellation of queued gate runs"): حتى مع cancel-in-progress:
  #   false (الإصلاح العاشر)، طابور concurrency يسمح بعضو "قيد انتظار" واحد فقط — فحدث
  #   ثالث يُلغي عضو الانتظار قبل أن يبدأ تنفيذه إطلاقاً، فيظهر CANCELLED داخلي من جديد
  #   بصرف النظر عن قيمة cancel-in-progress. هذا بالضبط ما دفع للإصلاح الحادي عشر (حذف
  #   concurrency بالكامل).
  #
  #   P1 الثاني ("Keep gate runs serialized until publication is atomic"، رُصد على هذا
  #   الفرع بعد حذف concurrency بالإصلاح الحادي عشر): بلا concurrency، تشغيلان قد يجتازان
  #   حارس stale-generation (external_id) قبل أن يكتب أيّهما فعلياً — lookup-then-write
  #   غير ذرّي بطبيعته في Checks API، ولا compare-and-swap حقيقياً فيها — ثم يكتب الأقدم
  #   فعلياً بعد الأحدث على شبكة GitHub فيطمس نتيجة صحيحة. حلقة المصالحة الزمنية (٤٥ ثانية،
  #   الإصلاحان الثامن والتاسع) كانت تخفيفاً عملياً محدوداً بنافذة زمنية، لا ضماناً ذرّياً —
  #   تأخر runner queue فعلياً قد يتجاوزها بسهولة الآن بلا أي قيد concurrency يحدّ التوازي.
  #
  #   جذر الثغرتين واحد: لا compare-and-swap ذرّياً حقيقياً لا في طابور GitHub Actions
  #   concurrency (عمق pending محدود بـ١ فقط، انظر الإصلاح الحادي عشر) ولا في Checks API
  #   (PATCH/POST عاديان بلا "قيمة متوقَّعة" يُرفض التحديث إن تغيّرت — موثَّق صراحة في
  #   تعليقات الإصلاحين الثامن والتاسع أعلاه). لا يمكن إغلاق كلا السباقين معاً بأي حارس
  #   lookup-then-write إضافي فوق نفس الأساس غير الذرّي — هذه ثغرة بنيوية، لا خللاً يُصلَح
  #   بمزيد من الترقيع الزمني.
  #
  #   الحل: git نفسه يوفّر compare-and-swap ذرّياً حقيقياً على مستوى بروتوكول تحديث المرجع
  #   (ref)، ينفّذه خادم GitHub نفسه فحص طلب بطلب — لا حساب محلي عرضة للسباق:
  #     • `POST /git/refs` (إنشاء ref جديد) يفشل صراحة (422) إن كان الـref موجوداً بالفعل.
  #     • `PATCH /git/refs/{ref}` بـ`force=false` يفشل صراحة (422) إن لم يكن الـsha الجديد
  #       امتداداً (fast-forward) حرفياً لِما هو موجود فعلياً على الخادم في تلك اللحظة
  #       بالضبط — هذا هو الـ"compare" الذرّي: أبو commit-نا الجديد يجب أن يطابق ما رأيناه
  #       نحن آخر مرة، وإلا يُرفض التحديث كاملاً.
  #
  #   الآلية: refs/gate-lock/pr-<PR_NUMBER> يشير دائماً إلى commit فارغ الشجرة (tree =
  #   empty tree الثابتة "4b825dc642cb6eb9a060e54bf8d69288fbee4904"، موجودة حتماً في أي
  #   مستودع git) تحمل رسالته generation آخر تشغيل "فاز" بحق الكتابة على check-run الكانوني.
  #   كل تشغيل: يقرأ القفل الحالي → إن كانت generation المخزَّنة ≥ generation هذا التشغيل،
  #   فهو قديم بالتعريف ويخرج فوراً بلا أي محاولة كتابة (لا حتى محاولة أخذ القفل، ولا أي
  #   كتابة على check-run الكانوني إطلاقاً). وإلا يبني commit جديداً أبوه القفل الحالي
  #   المُلاحَظ (فيكون fast-forward حصراً منه)، ويحاول تثبيته ذرّياً عبر PATCH/POST أعلاه.
  #   نجاح تلك المحاولة الذرّية هو الدليل الوحيد المعتمَد على "امتلاك حق الكتابة" — عند
  #   الفشل (خسر السباق)، يُعاد قراءة القفل من جديد ومقارنة generation-ـه بمقارنة
  #   generation هذا التشغيل (retry محدود، بلا انتظار طويل ولا اعتماد على queue behavior
  #   إطلاقاً)؛ إن ثبت أن القفل صار الآن يحمل generation أحدث أو مساوية، يخرج التشغيل
  #   فوراً بلا كتابة (لم يعد يستحق المحاولة). الخاسر لا يكتب على check-run إطلاقاً — وليس
  #   "يكتب ثم يُكتشف طمسه لاحقاً" كما في التصميم القديم — فلا حاجة لأي حارس lookup-then-
  #   write منفصل بعد الفوز، ولا لأي حلقة مصالحة زمنية بعد الكتابة (الإصلاحان الثامن
  #   والتاسع بكامل منطقهما أصبحا غير ضروريين هيكلياً وحُذفا من خطوة "publish" أدناه).
  #
  #   بعد الفوز بالقفل، يُعاد التحقق مباشرة (دون اعتماد على شيء افتُرض وقت المحاولة) من:
  #   HEAD الحيّ للـPR (push جديد وصل أثناء محاولات القفل؟)، وgeneration هذا التشغيل مقابل
  #   القفل الذي كتبناه للتو (دفاع إضافي)، وcheck-run الكانوني الحالي (existing_id/
  #   external_id) قبل أي PATCH/POST نهائي — تماماً كما كان الحارسان السابع الأول/الثاني،
  #   لكن الآن بلا حاجة فعلية لهما لضمان الصحة (القفل وحده يكفي) — يبقيان دفاعاً مزدوجاً
  #   رخيص التكلفة، غير ضارّين.
  #
  #   لا deadlock عند crash/timeout، وبلا أي TTL/انتهاء صلاحية زمنية: لا يوجد "تحرير" صريح
  #   للقفل مطلقاً — القفل هنا ليس mutex تقليدياً يُحتجز ثم يُحرَّر، بل مؤشر تصاعدي أحادي
  #   الاتجاه (monotonic claim) لأعلى generation حاولت الكتابة. إن تعطّل تشغيل بعد أخذ
  #   القفل ولم يُكمل نشر check-run (crash أو timeout)، يبقى القفل مشيراً إلى generation
  #   ذلك التشغيل فقط — وأي تشغيل لاحق شرعي (بالتعريف يحمل generation أحدث دائماً، لأن
  #   github.run_id تصاعدي زمنياً حتماً لكل تشغيل جديد) يبقى قادراً دوماً على تجاوزه عبر
  #   نفس آلية CAS الطبيعية (أبو الـcommit الجديد = القفل "المُعطَّل"). التصاعد الطبيعي
  #   لـrun_id يضمن بحكم البناء عدم وجود احتجاز دائم — لا حاجة لأي منطق انتهاء صلاحية.
  #
  #   لا حاجة لإعادة قيد concurrency: القفل يسري على كتابة check-run الكانوني تحديداً
  #   (نقطة السباق الوحيدة الفعلية)، لا على تنفيذ الـjob كاملاً — فكل التشغيلات حرة تماماً
  #   بالتوازي دون أي طابور GitHub Actions يُلغي أي منها (لا CANCELLED من هذا المصدر
  #   إطلاقاً)، وحصراً محاولة الفوز بالقفل هي ما يُسلسِل الكتابة الفعلية على الـChecks API.
  #
  #   منطق مقارنة generation موثَّق ومختبَر آلياً (isStaleWrite، مُعاد استخدامه هنا حرفياً
  #   لمقارنة generation القفل) في codex-review-gate-logic.mjs + check-codex-review-gate-
  #   logic.mjs (جزء من npm run check) — بما يشمل 5 سيناريوهات regression مطلوبة صراحة:
  #   (1) ثلاثة triggers متزامنة ⇒ واحدة فقط تفوز بالقفل، (2) run قديم يتأخر ⇒ لا يكتب
  #   بعد run أحدث، (3) push يغيّر HEAD أثناء run ⇒ يخرج stale بلا كتابة، (4) crash/timeout
  #   ⇒ لا deadlock دائم (تشغيل لاحق أحدث يتجاوز القفل بنجاح)، (5) check-run كانوني واحد
  #   فقط لكل head_sha.

  # ⚠️ إصلاح جوهري ثالث عشر بتاريخ 2026-08-31 (تثبيت الملكية حتى لحظة الكتابة الفعلية —
  #   ردّاً على P1 حيّين رصدهما Codex على commit `dd260aba37` نفسه، فوق الإصلاح الثاني عشر):
  #
  #   P1 الأول ("Keep ownership until the check write completes"): الفوز بالقفل (acquire_lock)
  #   هو حدث لحظي فقط — لا يضمن بقاء هذا التشغيل هو الحائز الوحيد طوال الوقت حتى خطوة
  #   "publish". بما أن generation أحدث يمكنها دائماً تجاوز (supersede) قفل generation أقدم
  #   عبر نفس آلية الـCAS (هذا سلوك مقصود: انظر الإصلاح الثاني عشر — "لا حاجة لإعادة قيد
  #   concurrency")، فمن الممكن نظرياً أن يفوز تشغيلان بالقفل تباعاً (الأقدم أولاً، ثم
  #   الأحدث يتجاوزه) بينما ما زال الأقدم يُنفّذ خطوة publish الخاصة به. حارس stale-generation
  #   على check-run نفسه (الإصلاح السابع) يوقف الأغلبية الساحقة من هذه الحالات، لكنه يقرأ
  #   ثم يكتب (lookup-then-write) بلا CAS حقيقي على Checks API ذاتها — فتبقى نافذة سباق
  #   نظرية ضيقة جداً إن تداخلت قراءتا التشغيلين قبل أن يكتب أيّهما.
  #
  #   الحل: قبل الكتابة الفعلية على Checks API مباشرة (بعد حارس stale-generation الحالي،
  #   لا بدلاً عنه)، تُعاد قراءة refs/gate-lock/pr-<PR_NUMBER> من جديد وتُقارن generation-ـه
  #   حرفياً بـgeneration هذا التشغيل بالذات (تطابق تام، لا "أحدث أو يساوي" فقط) — إن لم
  #   يعد هذا التشغيل هو الحائز الحالي الدقيق للقفل (تجاوزه تشغيل آخر منذ الفوز الأول)، يخرج
  #   بلا أي كتابة (exit 0) واثقاً أن الحائز الجديد سيتولى النشر بنفس الآلية. هذا يُضيّق
  #   نافذة السباق إلى المسافة الزمنية بين إعادة قراءة القفل وطلب PATCH/POST الفعلي فقط —
  #   لا يمكن إغلاقها كلياً بلا معاملة (transaction) ذرّية واحدة تغطي كِلا الـAPI معاً، وهو
  #   غير متاح في GitHub REST. الأثر الأسوأ عند تحقق تلك النافذة الضيقة جداً فعلياً: كتابة
  #   قديمة عابرة قد تُعقِّب كتابة أحدث (مثلاً in_progress بعد success) فتبقي required check
  #   معلَّقاً حتى إعادة تشغيل لاحقة (push أو تعليق @codex review) — أثر آمن دائماً (لا يمكن
  #   أبداً أن يظهر "نجاح" زائف لمراجعة لم تحدث فعلياً، لأن REVIEWED_COUNT يُحسَب حياً من
  #   جديد في كل تشغيل)، وليس أثراً كارثياً أو أمنياً.
  #
  #   P1 الثاني ("Do not silently drop the final lock contender"): مع MAX_ATTEMPTS محدود
  #   (كان ٦) وتحت تنافس كثيف (٧+ تشغيلات متزامنة)، تشغيل يحمل أحدث تقييم صحيح لمراجعة Codex
  #   قد يخسر كل محاولاته بسبب تنافس عابر (لا staleness حقيقية) فيتخلى عن الكتابة ظنّاً أن
  #   تشغيلاً لاحقاً سينشر بدلاً عنه — رغم عدم وجود ضمان بوصول أي حدث لاحق فعلياً، فيبقى
  #   الـcheck-run الكانوني عالقاً pending رغم مراجعة صحيحة فعلاً منشورة.
  #
  #   الحل: رفع MAX_ATTEMPTS من ٦ إلى ٢٠ مع تأخير عشوائي (jitter) بين المحاولات (1-3 ثوانٍ)
  #   بدل تأخير ثابت — يجعل استنفاد كل المحاولات بسبب تنافس عابر بحت (لا staleness) نادراً
  #   عملياً جداً حتى تحت تدفق أحداث كثيف. عند الاستنفاد الفعلي رغم ذلك (احتمال ضئيل جداً)،
  #   يبقى الخروج بلا كتابة (exit 0) — لا نُفشل الـjob (exit 1) عمداً، لأن فشل هذا الـjob
  #   تحديداً يُنتج check-run تلقائياً بـconclusion=failure على هذا التشغيل الداخلي، وهذا
  #   بالضبط ما صمَّم الإصلاحان العاشر/الحادي عشر لمنعه (تلويث statusCheckRollup) — لكن
  #   نُصدر تحذيراً صريحاً مرئياً (`::warning::`) في سجلّ التشغيل نفسه، بحيث لا يبقى الاستنفاد
  #   "صامتاً" أمام من يراجع سجلّات الـActions لاحقاً، حتى وإن لم يُفشل الـjob. required check
  #   يبقى "pending" (آمن، لا يمنح نجاحاً زائفاً) حتى وصول أي تشغيل لاحق (push أو @codex
  #   review) — نفس الأثر الآمن الموصوف أعلاه لثغرة P1 الأولى، وليس فقداناً دائماً للنتيجة.

  # ⚠️ إصلاح جوهري رابع عشر بتاريخ 2026-08-31 (إغلاق النافذتين المتبقيتين فعلياً — ردّاً على
  #   P1 حيّين جديدين رصدهما Codex على commit `780adea691` نفسه، فوق الإصلاح الثالث عشر):
  #
  #   P1 الأول ("Make ownership atomic with check publication"): الإصلاح الثالث عشر أعاد
  #   قراءة القفل قبل الكتابة، لكن النافذة بين تلك القراءة وطلب PATCH/POST الفعلي بقيت غير
  #   محمية — تشغيل أحدث قد يفوز بالقفل ويكتب نجاحه بين تحقّقنا وكتابتنا فعلياً، فنُعقِّبه
  #   بكتابة قديمة. الحل الجذري: التخلي تماماً عن استخدام مرجع القفل كإثبات ملكية لحظة
  #   الكتابة (هو أداة تسلسل الوصول لخطوة acquire_lock فقط، لا أكثر)، والاعتماد حصراً على
  #   المصدر الحقيقي للتنافس: حقل external_id على check-run الكانوني نفسه. الآن publish
  #   يعمل بحلقة "اقرأ → إن كانت كتابتنا موجودة بالفعل فانتهِ → إن كانت stale فاخرج بلا كتابة
  #   → اكتب → أعد القراءة فوراً للتأكد أن كتابتنا هي التي ظهرت فعلياً → إن لم تكن، أعد المحاولة
  #   من الأول". هذا يُغلق الفجوة فعلياً: أي تشغيل بـgeneration أقل يكتشف نفسه stale في أول
  #   قراءة تالية إن كُتب فوقه أحدث، وأي تشغيل بـgeneration أعلى يستمر بإعادة الكتابة حتى تُؤكَّد،
  #   فتتقارب النتيجة النهائية دائماً لأعلى generation فعلياً كتب، بصرف النظر عن ترتيب التداخل.
  #
  #   P1 الثاني ("Retry rather than discard the final contender"): نفس المبدأ يُطبَّق على
  #   acquire_lock — بدل عدّاد محاولات ثابت (MAX_ATTEMPTS=20) يُسقِط أحدث تقييم بعد استنفاده رغم
  #   عدم staleness حقيقية، تُستبدل الحلقة بمهلة زمنية (3 دقائق) تُعاد فيها المحاولة باستمرار
  #   حتى الفوز الفعلي بالقفل أو رصد generation أحدث صريحاً (staleness حقيقية) — لا استسلام
  #   بسبب عدد محاولات تعسفي وحده. المهلة الزمنية (لا عدّاد صغير) هي الحارس الوحيد ضد استهلاك
  #   وقت تشغيل لا نهائي؛ عند استنفادها فعلياً (سيناريو نادر جداً يتطلب تنافساً كثيفاً مستمراً
  #   لثلاث دقائق كاملة)، يبقى الخروج بلا كتابة (exit 0، لا exit 1 — لنفس سبب تلويث
  #   statusCheckRollup الموثّق أعلاه) مع تحذير `::warning::` مرئي، لا صامت. نفس المبدأ يُطبَّق
  #   على حلقة publish الجديدة (مهلة 3 دقائق مستقلة لتأكيد النشر بعد كل كتابة).

jobs:
  gate:
    # ⚠️ إصلاح جوهري سادس (2026-08-31): يُمنع نهائياً أن يكون اسم الـjob هنا حرفياً
    # "Codex Review Gate" — GitHub Actions ينشئ check-run تلقائياً بهذا الاسم بالضبط لكل
    # تشغيل، فيتصادم مع الـcheck-run الكانوني المُدار يدوياً بنفس الاسم (المطلوب فعلياً في
    # ruleset الفرع main). الاسم هنا معلوماتي/تشخيصي فقط في تبويب Actions — لا علاقة له
    # بنتيجة الـGate الفعلية إطلاقاً.
    name: Codex Review Gate (تشغيل داخلي — ليس Required Check)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issue_comment' && github.event.issue.pull_request != null ||
      github.event.pull_request.base.ref == 'main'
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CODEX_BOT_LOGIN: chatgpt-codex-connector[bot]
    steps:
      - name: تحديد رقم الـPR والـHEAD SHA الحالي
        id: pr
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "لا يوجد رقم PR في الحدث — تجاوز." >&2
            exit 1
          fi
          # نعيد جلب حالة الـPR وقت التشغيل نفسه لتفادي أي سباق مع push سريع متتالي.
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          BASE_REF=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.base.ref')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          # ⚠️ إصلاح جوهري سابع بتاريخ 2026-08-31: "generation" تصاعدية فريدة لهذا التشغيل
          # تحديداً (run_id يخصّصه GitHub تصاعدياً وقت إنشاء التشغيل نفسه — لا علاقة له
          # بترتيب الاكتمال؛ run_attempt يميّز إعادة تشغيل يدوية لنفس run_id). تُستخدم
          # لاحقاً كحارس تشغيل قديم صريح قبل أي كتابة نهائية على check-run الكانوني.
          echo "generation=${{ github.run_id }}.${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER — head sha: $HEAD_SHA — base: $BASE_REF"

      - name: تخطّي إذا الـbase ليس main (حالة workflow_dispatch فقط)
        if: github.event_name == 'workflow_dispatch' && steps.pr.outputs.base_ref != 'main'
        run: |
          echo "هذا الـPR ليس موجهاً إلى main — تم تجاوز الفحص."
          exit 0

      - name: فحص مراجعة Codex على الـHEAD الحالي (commit_id فقط، لا timestamps)
        id: check
        if: steps.pr.outputs.base_ref == 'main'
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          HEAD_SHA="${{ steps.pr.outputs.head_sha }}"

          # إصلاح ملاحظة Codex P1 (pagination بتاريخ 2026-08-27):
          # `gh api --paginate` يطبع كل صفحة كقيمة JSON مستقلة على التوالي (وليس كمصفوفة
          # واحدة)، فتطبيق jq مباشرة على `.[]` كان يُنتج سطر نتيجة منفصل لكل صفحة بدل رقم
          # واحد. الحل: نجمع كل الصفحات بـ`jq -s` (slurp) إلى مصفوفة-من-مصفوفات، ثم
          # `add` لدمجها في مصفوفة مسطّحة واحدة قبل أي عدّ أو تصفية.
          REVIEWS_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            | jq -s '(add // [])')
          FORMAL_REVIEW_COUNT=$(echo "$REVIEWS_JSON" | jq --arg sha "$HEAD_SHA" --arg bot "$CODEX_BOT_LOGIN" \
            '[.[] | select(.user.login == $bot and .commit_id == $sha)] | length')

          COMMENTS_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate \
            | jq -s '(add // [])')
          # إصلاح 2026-08-31: original_commit_id فقط (وليس commit_id) — انظر تعليق
          # "إصلاح جوهري ثالث" أعلى الملف لتفصيل ثغرة إعادة الربط التلقائي بعد rebase.
          REVIEW_COMMENT_COUNT=$(echo "$COMMENTS_JSON" | jq --arg sha "$HEAD_SHA" --arg bot "$CODEX_BOT_LOGIN" \
            '[.[] | select(.user.login == $bot and .original_commit_id == $sha)] | length')

          # إصلاح 2026-08-29: الـartifact الحقيقي الذي ينشره Codex هو Issue Comment عادي
          # (POST /issues/{n}/comments)، بنص يتضمن "**Reviewed commit:** `<short-sha>`".
          # لا يظهر لا في pulls/reviews ولا في pulls/comments إطلاقاً. نستخرج الـshort-sha
          # بـregex صارم من نص التعليق فقط (لا استدلال آخر)، ونطابقه كـprefix حرفي
          # لـhead_sha الحالي — لا اعتماد على created_at إطلاقاً.
          ISSUE_COMMENTS_JSON=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            | jq -s '(add // [])')
          BOT_ISSUE_BODIES=$(echo "$ISSUE_COMMENTS_JSON" | jq -r --arg bot "$CODEX_BOT_LOGIN" \
            '.[] | select(.user.login == $bot) | .body')

          HEAD_SHA_LC=$(echo "$HEAD_SHA" | tr '[:upper:]' '[:lower:]')
          ISSUE_COMMENT_MATCH=0
          if [ -n "$BOT_ISSUE_BODIES" ]; then
            while IFS= read -r SHORT_SHA; do
              [ -z "$SHORT_SHA" ] && continue
              SHORT_SHA_LC=$(echo "$SHORT_SHA" | tr '[:upper:]' '[:lower:]')
              case "$HEAD_SHA_LC" in
                "$SHORT_SHA_LC"*) ISSUE_COMMENT_MATCH=1 ;;
              esac
            done < <(echo "$BOT_ISSUE_BODIES" | grep -oP 'Reviewed commit:\*\*\s*`\K[0-9a-fA-F]{7,40}' || true)
          fi

          # طبقة معلوماتية best-effort فقط: عدّ شارات P0/P1/P2/P3 في تعليقات Codex
          # المرتبطة بنفس الـHEAD (review comments). لا تُستخدم هذه القيمة لإسقاط الفحص.
          BADGES=$(echo "$COMMENTS_JSON" | jq -r --arg sha "$HEAD_SHA" --arg bot "$CODEX_BOT_LOGIN" \
            '[.[] | select(.user.login == $bot and .original_commit_id == $sha) | .body] | join("\n")' \
            | grep -oE 'badge/P[0-3]-' | sort | uniq -c || true)

          if [ -z "$BADGES" ]; then
            BADGES="(لا توجد شارات درجة خطورة ملحوظة على هذا الـHEAD — أو Codex لم يستخدم هذا التنسيق)"
          fi

          echo "reviewed_count=$((FORMAL_REVIEW_COUNT + REVIEW_COMMENT_COUNT + ISSUE_COMMENT_MATCH))" >> "$GITHUB_OUTPUT"
          {
            echo "badges<<EOF"
            echo "$BADGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$FORMAL_REVIEW_COUNT" -gt 0 ] || [ "$REVIEW_COMMENT_COUNT" -gt 0 ] || [ "$ISSUE_COMMENT_MATCH" -eq 1 ]; then
            echo "summary=تمت مراجعة $CODEX_BOT_LOGIN لأحدث commit ($HEAD_SHA)." >> "$GITHUB_OUTPUT"
          else
            echo "summary=لا توجد مراجعة من $CODEX_BOT_LOGIN على أحدث commit ($HEAD_SHA) بعد. انتظر المراجعة التلقائية، أو علّق @codex review، ثم أعد المحاولة." >> "$GITHUB_OUTPUT"
          fi

      - name: أخذ قفل ذرّي عبر git ref (refs/gate-lock/pr-<PR_NUMBER>) قبل أي كتابة على check-run الكانوني
        id: acquire_lock
        if: steps.pr.outputs.base_ref == 'main'
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          GENERATION="${{ steps.pr.outputs.generation }}"
          LOCK_REF="gate-lock/pr-$PR_NUMBER"
          EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          # ⚠️ إصلاح جوهري رابع عشر بتاريخ 2026-08-31: مهلة زمنية (3 دقائق) بدل عدّاد محاولات
          # ثابت — لا نستسلم بسبب عدد محاولات تعسفي وحده طالما لم نُصبح stale فعلياً (لم يظهر
          # generation أحدث صريحاً). انظر تعليق "إصلاح جوهري رابع عشر" أعلى الملف.
          LOCK_DEADLINE=$(( $(date +%s) + 180 ))

          # انظر شرح الإصلاح الجوهري الثاني عشر أعلى الملف لتفصيل التصميم الكامل. خلاصة
          # الآلية هنا: CAS ذرّي حقيقي عبر بروتوكول git نفسه (لا اعتماد على أي نافذة زمنية
          # ولا على queue behavior لطابور GitHub Actions) — المهلة هنا فقط حارس ضد استهلاك
          # وقت تشغيل لا نهائي، وليست شرط توقّف طبيعياً للتصميم.
          ATTEMPT=0
          WON="false"
          SKIP_REASON=""
          while :; do
            ATTEMPT=$((ATTEMPT + 1))

            CURRENT_LOCK_SHA=""
            if REF_JSON=$(gh api "repos/$REPO/git/ref/$LOCK_REF" 2>/dev/null); then
              CURRENT_LOCK_SHA=$(echo "$REF_JSON" | jq -r '.object.sha // empty')
            fi

            if [ -n "$CURRENT_LOCK_SHA" ]; then
              LOCK_GENERATION=$(gh api "repos/$REPO/git/commits/$CURRENT_LOCK_SHA" --jq '.message' 2>/dev/null | head -n1 | tr -d '[:space:]')
              LOCK_RUN_ID="${LOCK_GENERATION%%.*}"
              LOCK_ATTEMPT_N="${LOCK_GENERATION##*.}"
              CURRENT_RUN_ID="${GENERATION%%.*}"
              CURRENT_ATTEMPT_N="${GENERATION##*.}"
              IS_STALE=0
              if [ -n "$LOCK_RUN_ID" ] && [ "$LOCK_RUN_ID" -gt "$CURRENT_RUN_ID" ] 2>/dev/null; then
                IS_STALE=1
              elif [ -n "$LOCK_RUN_ID" ] && [ "$LOCK_RUN_ID" -eq "$CURRENT_RUN_ID" ] 2>/dev/null && [ "$LOCK_ATTEMPT_N" -ge "$CURRENT_ATTEMPT_N" ] 2>/dev/null; then
                IS_STALE=1
              fi
              if [ "$IS_STALE" -eq 1 ]; then
                echo "تخطٍّ بلا كتابة: القفل يحمل بالفعل generation أحدث أو مساوية ($LOCK_GENERATION >= $GENERATION) — هذا التشغيل قديم/متأخر."
                SKIP_REASON="stale"
                break
              fi
              PARENTS_JSON=$(jq -n --arg p "$CURRENT_LOCK_SHA" '[$p]')
            else
              PARENTS_JSON="[]"
            fi

            NEW_COMMIT_SHA=$(jq -n --arg msg "$GENERATION" --arg tree "$EMPTY_TREE" --argjson parents "$PARENTS_JSON" \
              '{message: $msg, tree: $tree, parents: $parents}' \
              | gh api "repos/$REPO/git/commits" --method POST --input - --jq '.sha' 2>/dev/null || echo "")
            if [ -z "$NEW_COMMIT_SHA" ]; then
              if [ "$(date +%s)" -ge "$LOCK_DEADLINE" ]; then
                echo "استنفاد المهلة الزمنية (180 ثانية) أثناء محاولة إنشاء commit القفل (محاولة $ATTEMPT) — خروج بلا كتابة."
                SKIP_REASON="contention"
                break
              fi
              echo "فشل إنشاء commit القفل (محاولة $ATTEMPT) — إعادة محاولة."
              sleep 1
              continue
            fi

            if [ -z "$CURRENT_LOCK_SHA" ]; then
              # إنشاء أول لمرجع القفل — ذرّي: يفشل 422 إن أنشأه تشغيل آخر للتو قبلنا مباشرة.
              if gh api "repos/$REPO/git/refs" --method POST -f "ref=refs/$LOCK_REF" -f "sha=$NEW_COMMIT_SHA" >/dev/null 2>&1; then
                WON="true"; break
              fi
            else
              # تحديث ذرّي: force=false يفشل 422 إن لم يعد commit-نا امتداداً (fast-forward)
              # حرفياً لما هو موجود فعلياً على الخادم الآن — أي أن تشغيلاً آخر سبقنا للفوز
              # بالقفل منذ آخر قراءة لنا. هذا هو الـcompare-and-swap الذرّي الحقيقي.
              if gh api "repos/$REPO/git/refs/$LOCK_REF" --method PATCH -f "sha=$NEW_COMMIT_SHA" -F "force=false" >/dev/null 2>&1; then
                WON="true"; break
              fi
            fi
            if [ "$(date +%s)" -ge "$LOCK_DEADLINE" ]; then
              echo "استنفاد المهلة الزمنية (180 ثانية) لأخذ القفل (محاولة $ATTEMPT) دون staleness حقيقية — خروج بلا كتابة."
              SKIP_REASON="contention"
              break
            fi
            echo "خسر هذا التشغيل سباق أخذ القفل (محاولة $ATTEMPT) — إعادة قراءة القفل والمحاولة من جديد."
            sleep "$(( (RANDOM % 3) + 1 ))"
          done

          if [ "$WON" = "true" ]; then
            echo "won=true" >> "$GITHUB_OUTPUT"
          else
            echo "won=false" >> "$GITHUB_OUTPUT"
            if [ "$SKIP_REASON" = "stale" ]; then
              echo "skip_reason=stale" >> "$GITHUB_OUTPUT"
            else
              echo "skip_reason=contention" >> "$GITHUB_OUTPUT"
              # ⚠️ إصلاح جوهري رابع عشر: لا نُفشل الـjob هنا عمداً (يلوّث statusCheckRollup
              # عبر check-run تلقائي بـfailure — انظر تعليق "إصلاح جوهري ثالث عشر" أعلى
              # الملف) لكن نُصدر تحذيراً مرئياً صريحاً كي لا يبقى الاستنفاد صامتاً في السجلّ.
              echo "::warning title=Codex Review Gate — استنفاد مهلة القفل::لم يفز هذا التشغيل ($GENERATION) بالقفل خلال 180 ثانية رغم عدم وجود generation أحدث معروفة (تنافس عابر مستمر) — لن يكتب على check-run الكانوني؛ required check يبقى pending (آمن) حتى تشغيل لاحق (push أو تعليق @codex review)."
              echo "لم يفز هذا التشغيل بالقفل خلال 180 ثانية (تنافس عابر) — يخرج بلا كتابة؛ تشغيل لاحق (generation أحدث) سيتولى النشر." >&2
            fi
          fi

      - name: تحديث Check Run الكانوني الوحيد لهذا الـHEAD (إنشاء إن لم يوجد، وإلا PATCH لنفس الـid) — بعد الفوز بالقفل الذرّي فقط
        id: publish
        if: steps.pr.outputs.base_ref == 'main' && steps.acquire_lock.outputs.won == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          HEAD_SHA="${{ steps.pr.outputs.head_sha }}"
          GENERATION="${{ steps.pr.outputs.generation }}"
          REVIEWED_COUNT="${{ steps.check.outputs.reviewed_count }}"
          SUMMARY="${{ steps.check.outputs.summary }}"
          NAME="Codex Review Gate"

          # ⚠️ إصلاح جوهري خامس بتاريخ 2026-08-31: لا يُنشأ check-run جديد أبداً إن كان
          # يوجد بالفعل واحد بنفس الاسم على نفس head_sha بالضبط — يُحدَّث في مكانه (PATCH)
          # كي لا يتعايش قديم (FAIL شرعي وقته) مع جديد (PASS) على نفس الـsha، فلا يتلوّث
          # rollup الـruleset أبداً. انظر تعليق "إصلاح جوهري خامس" أعلى الملف.
          # ملاحظة (إصلاح جوهري سادس 2026-08-31): لا نستخدم `-f check_name=...` هنا —
          # ثبت أن `gh api` يُرجع 404 خاطئاً مع هذه التركيبة تحديداً (قيمة تحوي مسافة +
          # --paginate). نجلب كل check-runs على هذا الـsha ونصفّي بالاسم عبر jq بعد الجلب.

          # ⚠️ إصلاح جوهري سابع بتاريخ 2026-08-31 — الحارس الأول: إعادة قراءة head.sha
          # الحيّ للـPR مباشرة قبل أي كتابة نهائية. إن تغيّر (push جديد وصل أثناء تنفيذ هذا
          # التشغيل تحديداً) فهذا التشغيل لم يعد يخص أحدث HEAD إطلاقاً — يخرج بلا أي كتابة،
          # مهما كانت نتيجته المحسوبة سابقاً. انظر تعليق "إصلاح جوهري سابع" أعلى الملف.
          LIVE_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$LIVE_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "تخطٍّ بلا كتابة: HEAD تغيّر أثناء هذا التشغيل ($HEAD_SHA → $LIVE_HEAD_SHA) — هذا التشغيل لم يعد يخص أحدث HEAD."
            exit 0
          fi

          # ⚠️ إصلاح جوهري رابع عشر بتاريخ 2026-08-31: استبدال كل الفحوصات "اقرأ ثم قارن ثم
          # اكتب" أحادية الطلقة (بما فيها فحص lock-ref القديم من الإصلاح الثالث عشر) بحلقة
          # write-then-verify. السبب الجذري: GitHub Checks API لا يدعم compare-and-swap ولا
          # ETag/If-Match إطلاقاً — أي تسلسل "تحقق ثم اكتب" مهما ضاقت نافذته الزمنية يبقى
          # عرضة نظرياً لكتابة متزامنة تحدث بين التحقق والكتابة الفعلية. المصدر الحقيقي
          # الوحيد للحقيقة هنا هو حقل external_id على check-run الكانوني نفسه، بعد كل كتابة
          # فعلية — لا قبلها. انظر تعليق "إصلاح جوهري رابع عشر" أعلى الملف لتفصيل التصميم.
          TEXT=$(jq -n --arg badges "${{ steps.check.outputs.badges }}" \
            '"### درجات الخطورة (best-effort، معلوماتي فقط — غير حاكم للدمج)\n```\n" + $badges + "\n```\n\nمنع الدمج مع ملاحظات مفتوحة يُفرض عبر إعداد GitHub \"Require conversation resolution before merging\"، وليس عبر هذا الفحص."')

          if [ "$REVIEWED_COUNT" -gt 0 ]; then
            STATUS_FIELDS='"status":"completed","conclusion":"success"'
          else
            # ⚠️ لا success ولا failure طالما لا توجد مراجعة على هذا الـHEAD تحديداً —
            # in_progress فقط (pending). required status check غير مكتمل بـsuccess يمنع
            # الدمج بنفس الفعالية، دون أي احتمال لنشر failure قديم يلوّث check-run لاحقاً.
            STATUS_FIELDS='"status":"in_progress"'
          fi

          # ⚠️ إصلاح جوهري خامس عشر بتاريخ 2026-08-31 — ردّاً على 2 P1 حيّين رصدهما Codex
          # على commit 43c765d (الإصلاح الرابع عشر نفسه):
          # (أ) "Do not treat an immediate read-back as final": التأكيد الفوري على
          #     check-run وحده لا يمنع تشغيلاً أقدم — كان قد اجتاز فحص staleness الخاص به
          #     *قبل* أن يفوز تشغيل أحدث بالقفل أصلاً — من إتمام كتابته المتأخرة بعد أن
          #     أكّد التشغيل الأحدث نجاحه وخرج (لا يعاود التشغيل الأحدث الحلقة بعد التأكيد).
          #     الإصلاح: قبل أي محاولة كتابة، نقرأ refs/gate-lock/pr-<N> نفسه طازجاً —
          #     المصدر الوحيد الحقيقي لـCAS ذرّي — لا حالة محلية قديمة. أي تشغيل يفوز
          #     بالقفل عبر CAS في acquire_lock يُحدِّث هذا الـref فوراً، بصرف النظر عن متى
          #     يصل فعلياً لخطوة النشر. فتشغيل أقدم يكتشف تقدّم القفل هنا فوراً قبل الكتابة
          #     — لا بعدها — فتضيق نافذة السباق من "طوال مدة التشغيل" إلى زمن استجابة نداء
          #     API واحد فقط (أقل من ثانية عملياً)، لا نافذة زمنية ثابتة (لا 45 ثانية ولا
          #     أي رقم تعسفي) ولا اعتماد على queue behavior.
          # (ب) "Reconcile every concurrently created canonical check": عند إنشاء أول
          #     check-run لهذا الـHEAD (لا EXISTING_ID)، تشغيلان متزامنان قد يُنشئان كل
          #     منهما check-run منفصل بنفس الاسم. الإصلاح: نختار الكانوني بمقارنة generation
          #     صريحة (لا بترتيب id) عبر كل النسخ الموجودة، ثم — إن كنّا الكانوني الفعلي —
          #     نصالح (PATCH) كل نسخة أخرى مكرّرة بنفس المحتوى، فلا تبقى نسخة يتيمة بحالة
          #     مغايرة تُربك rollup الفحص المطلوب.
          # انظر تعليق "إصلاح جوهري خامس عشر" أعلى الملف لتفصيل التصميم الكامل.

          LOCK_REF="gate-lock/pr-$PR_NUMBER"

          # مقارنة generation عددية صريحة (run_id.attempt) — أدق من مقارنة نصية أو ترتيب id.
          is_generation_newer() {
            local cand="$1" base="$2"
            [ -z "$cand" ] && return 1
            [ -z "$base" ] && return 0
            local cr="${cand%%.*}" ca="${cand##*.}" br="${base%%.*}" ba="${base##*.}"
            if [ "$cr" -gt "$br" ] 2>/dev/null; then return 0; fi
            if [ "$cr" -eq "$br" ] 2>/dev/null && [ "$ca" -gt "$ba" ] 2>/dev/null; then return 0; fi
            return 1
          }

          # يختار الكانوني (أعلى generation فعلياً موجودة) من قائمة check-runs بنفس الاسم —
          # لا بترتيب id (الحارس ب أعلاه) — ويطبع "id<TAB>generation" لأسطر البقية (المكرّرة).
          pick_canonical() {
            local runs_json="$1"
            local cid="" cgen=""
            local dup_ids=""
            while IFS=$'\t' read -r rid rgen; do
              [ -z "$rid" ] && continue
              if [ -n "$cid" ]; then
                dup_ids="$dup_ids$cid"$'\n'
              fi
              if [ -z "$cgen" ] || is_generation_newer "$rgen" "$cgen"; then
                cid="$rid"; cgen="$rgen"
              else
                dup_ids="$dup_ids$rid"$'\n'
              fi
            done < <(echo "$runs_json" | jq -r '.[] | "\(.id)\t\(.external_id // "")"')
            printf '%s\t%s\t%s' "$cid" "$cgen" "$(echo "$dup_ids" | grep -v "^$cid$" | sort -u | tr '\n' ',')"
          }

          reconcile_duplicates() {
            # يُستدعى فقط عندما نكون نحن الكانوني الفعلي المؤكَّد. يصالح كل نسخة مكرّرة
            # أخرى بنفس محتوى النسخة الكانونية (نفس status/conclusion/output/generation)
            # كي لا تبقى نسخة يتيمة بحالة قديمة/مغايرة تُربك rollup الفحص المطلوب.
            local dup_csv="$1"
            [ -z "$dup_csv" ] && return 0
            local dup_id
            IFS=',' read -ra DUP_ARR <<< "$dup_csv"
            for dup_id in "${DUP_ARR[@]}"; do
              [ -z "$dup_id" ] && continue
              PAYLOAD=$(jq -n --arg name "$NAME" --arg summary "$SUMMARY" --arg generation "$GENERATION" --argjson text "$TEXT" \
                --argjson status_fields "{$STATUS_FIELDS}" \
                '{name: $name, external_id: $generation, output: {title: $name, summary: $summary, text: $text}} * $status_fields')
              gh api "repos/$REPO/check-runs/$dup_id" --method PATCH --input - <<< "$PAYLOAD" >/dev/null 2>&1 || true
              echo "تصالح: check-run مكرّر (id=$dup_id) على نفس الـsha جُعل مطابقاً للكانوني (generation=$GENERATION)."
            done
          }

          PUBLISH_DEADLINE=$(( $(date +%s) + 180 ))
          PUBLISH_ATTEMPT=0
          PUBLISHED="false"
          while :; do
            PUBLISH_ATTEMPT=$((PUBLISH_ATTEMPT + 1))

            # الحارس (أ): تحقّق طازج من refs/gate-lock — المصدر الوحيد الحقيقي للـCAS —
            # قبل أي كتابة. إن تقدّم لصالح generation أحدث منّا، هذا التشغيل قديم فعلياً
            # الآن (بصرف النظر هل كتب التشغيل الأحدث على check-run بعد أم لا) — خروج فوري
            # بلا كتابة، مهما كانت حالتنا المحلية (won=true سابقاً لا يعني ملكية دائمة).
            LIVE_LOCK_SHA=""
            if LOCK_REF_JSON=$(gh api "repos/$REPO/git/ref/$LOCK_REF" 2>/dev/null); then
              LIVE_LOCK_SHA=$(echo "$LOCK_REF_JSON" | jq -r '.object.sha // empty')
            fi
            if [ -n "$LIVE_LOCK_SHA" ]; then
              LIVE_LOCK_GENERATION=$(gh api "repos/$REPO/git/commits/$LIVE_LOCK_SHA" --jq '.message' 2>/dev/null | head -n1 | tr -d '[:space:]')
              if [ "$LIVE_LOCK_GENERATION" != "$GENERATION" ] && is_generation_newer "$LIVE_LOCK_GENERATION" "$GENERATION"; then
                echo "تخطٍّ بلا كتابة: refs/$LOCK_REF تقدّم لصالح generation أحدث ($LIVE_LOCK_GENERATION) قبل أي كتابة من هذا التشغيل — تشغيل أحدث فاز بالقفل، سواء نشر على check-run بعد أم لا."
                exit 0
              fi
            fi

            EXISTING_RUNS_JSON=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
              | jq -s --arg name "$NAME" '[.[].check_runs[] | select(.name == $name)]')
            IFS=$'\t' read -r EXISTING_ID EXISTING_GENERATION EXISTING_DUP_IDS <<< "$(pick_canonical "$EXISTING_RUNS_JSON")"

            if [ "$EXISTING_GENERATION" = "$GENERATION" ]; then
              # كتابتنا موجودة بالفعل — إما كتبناها في محاولة سابقة ولم نتأكد بعد، وإما
              # كتبها تشغيل آخر بنفس الـgeneration بالضبط (لا يحدث عملياً؛ generation فريدة
              # لكل تشغيل). إما حال، النتيجة الكانونية مطابقة لما نريد كتابته — انتهى.
              PUBLISHED="true"
              CHECK_RUN_ID="$EXISTING_ID"
              reconcile_duplicates "$EXISTING_DUP_IDS"
              break
            fi

            if [ -n "$EXISTING_GENERATION" ] && is_generation_newer "$EXISTING_GENERATION" "$GENERATION"; then
              echo "تخطٍّ بلا كتابة: check-run الكانوني يحمل بالفعل generation أحدث ($EXISTING_GENERATION > $GENERATION) — هذا التشغيل قديم/متأخر فعلياً، ممنوع من الكتابة فوق نتيجة أحدث."
              exit 0
            fi

            if [ -n "$EXISTING_ID" ]; then
              PAYLOAD=$(jq -n --arg name "$NAME" --arg summary "$SUMMARY" --arg generation "$GENERATION" --argjson text "$TEXT" \
                --argjson status_fields "{$STATUS_FIELDS}" \
                '{name: $name, external_id: $generation, output: {title: $name, summary: $summary, text: $text}} * $status_fields')
              gh api "repos/$REPO/check-runs/$EXISTING_ID" --method PATCH --input - <<< "$PAYLOAD" >/dev/null 2>&1 || true
              echo "محاولة تحديث check-run كانوني موجود (id=$EXISTING_ID, generation=$GENERATION، محاولة $PUBLISH_ATTEMPT): $NAME على $HEAD_SHA — reviewed_count=$REVIEWED_COUNT"
            else
              PAYLOAD=$(jq -n --arg name "$NAME" --arg sha "$HEAD_SHA" --arg summary "$SUMMARY" --arg generation "$GENERATION" --argjson text "$TEXT" \
                --argjson status_fields "{$STATUS_FIELDS}" \
                '{name: $name, head_sha: $sha, external_id: $generation, output: {title: $name, summary: $summary, text: $text}} * $status_fields')
              gh api "repos/$REPO/check-runs" --method POST --input - <<< "$PAYLOAD" >/dev/null 2>&1 || true
              echo "محاولة إنشاء check-run كانوني جديد (generation=$GENERATION، محاولة $PUBLISH_ATTEMPT): $NAME على $HEAD_SHA — reviewed_count=$REVIEWED_COUNT"
            fi

            # ⚠️ التأكيد الفوري (write-then-verify) — جوهر الإصلاح الرابع عشر، مع الحارس
            # (ب) للتصالح مع أي نسخة مكرّرة (الإصلاح الخامس عشر): نعيد قراءة كل check-runs
            # بهذا الاسم على نفس الـsha ونختار الكانوني بمقارنة generation صريحة (لا بترتيب
            # id). إن كتب تشغيل آخر (generation أحدث) بين طلبنا وقراءتنا هذه، لن نكون
            # الكانوني — فنعيد الحلقة فتكتشف نحن staleness-نا (عبر الحارس أ أو ب أعلاه) في
            # المرة القادمة، أو نعيد الكتابة إن لم تكن الكتابة المنافسة قد استقرّت بعد.
            CONFIRM_RUNS_JSON=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
              | jq -s --arg name "$NAME" '[.[].check_runs[] | select(.name == $name)]')
            IFS=$'\t' read -r CONFIRM_ID CONFIRM_GENERATION CONFIRM_DUP_IDS <<< "$(pick_canonical "$CONFIRM_RUNS_JSON")"
            if [ "$CONFIRM_GENERATION" = "$GENERATION" ]; then
              PUBLISHED="true"
              CHECK_RUN_ID="$CONFIRM_ID"
              echo "تأكيد النشر: check-run (id=$CONFIRM_ID, generation=$GENERATION) هو الكانوني الفعلي الآن."
              reconcile_duplicates "$CONFIRM_DUP_IDS"
              break
            fi

            if [ "$(date +%s)" -ge "$PUBLISH_DEADLINE" ]; then
              echo "::warning title=Codex Review Gate — استنفاد مهلة النشر::لم تُؤكَّد كتابة هذا التشغيل ($GENERATION) خلال 180 ثانية رغم عدم رصد generation أحدث صريحة — تنافس كتابة مستمر على check-run. required check يبقى بحالته الحالية (آمن) حتى تشغيل لاحق (push أو تعليق @codex review)."
              echo "لم تُؤكَّد كتابة هذا التشغيل خلال 180 ثانية (تنافس نشر مستمر) — خروج دون افتراض النجاح." >&2
              exit 0
            fi
            sleep "$(( (RANDOM % 3) + 1 ))"
          done

      - name: النتيجة الإعلامية للـjob (لا تحدد نتيجة الـGate — المصدر الوحيد هو الـcheck-run الكانوني أعلاه)
        if: steps.pr.outputs.base_ref == 'main'
        run: |
          set -euo pipefail
          REVIEWED_COUNT="${{ steps.check.outputs.reviewed_count }}"
          LOCK_WON="${{ steps.acquire_lock.outputs.won }}"
          SKIP_REASON="${{ steps.acquire_lock.outputs.skip_reason }}"

          # ⚠️ إصلاح جوهري ثاني عشر بتاريخ 2026-08-31: مع القفل الذرّي (acquire_lock) صار
          # publish شرطياً (won == 'true' فقط)، فإن outcome لخطوة skipped يساوي "skipped" لا
          # "success" — التحقق القديم (outcome != success) كان سيُفشل الـjob خطأً في كل مرة
          # يخسر فيها هذا التشغيل سباق القفل شرعاً (وهو سلوك متوقَّع وسليم، ليس عطلاً). الفارق
          # الآن: خسارة القفل (stale أو تنافس عابر) = نجاح معلوماتي بلا كتابة؛ أما فوز القفل ثم
          # فشل الكتابة الفعلية (خطأ API حقيقي، أو GITHUB_TOKEN قراءة فقط على fork/Dependabot)
          # فيبقى يُفشل الـjob كما كان تماماً.
          if [ "$LOCK_WON" != "true" ]; then
            if [ "$SKIP_REASON" = "stale" ]; then
              echo "لا كتابة: هذا التشغيل قديم (generation أقل من أو تساوي حامل القفل الحالي) — تشغيل أحدث سيتولى النشر."
            else
              echo "لا كتابة: لم يفز هذا التشغيل بقفل النشر بعد عدة محاولات (تنافس عابر) — تشغيل لاحق سيتولى النشر."
            fi
            exit 0
          fi

          if [ "${{ steps.publish.outcome }}" != "success" ]; then
            echo "خطأ: تحديث/إنشاء check-run الكانوني فشل رغم الفوز بالقفل (مثلاً GITHUB_TOKEN للقراءة فقط في fork/Dependabot PR) — الـGate يبقى معلّقاً (pending) حتى تشغيل لاحق ناجح." >&2
            exit 1
          fi

          if [ "$REVIEWED_COUNT" -gt 0 ]; then
            echo "Codex Review Gate = PASS: تمت مراجعة Codex على HEAD الحالي."
          else
            echo "Codex Review Gate = PENDING: لا توجد مراجعة Codex على HEAD الحالي بعد (in_progress، ليست failure)."
          fi
