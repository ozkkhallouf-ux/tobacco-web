name: فحص ozk-uptime Worker

# فحوص فقط: لا نشر ولا أسرار ولا اتصال بـCloudflare/Supabase/Telegram.
on:
  pull_request:
    paths:
      - 'workers/uptime/**'
      - 'supabase/proposed/14-uptime-ingest*.sql'
      - 'supabase/tests/uptime-ingest.sim.mjs'
      - '.github/workflows/uptime-worker-check.yml'

permissions:
  contents: read

concurrency:
  group: uptime-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # بلا npm install: الـWorker بلا اعتمادات، والاختبارات تعتمد node:test المدمج
      - name: Worker tests (simulated network/storage, DRY_RUN)
        run: node --test workers/uptime/test/*.test.mjs
      - name: Syntax check
        run: |
          for f in workers/uptime/src/*.mjs; do node --check "$f"; done

  # proposed/14 على PostgreSQL 17 حقيقي (نفس إصدار الإنتاج) داخل حاوية مؤقتة بلا أي اتصال خارجي
  ingest-sql-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: sim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: proposed/14 simulation (real PostgreSQL, local outbox, no Telegram)
        env:
          UPTIME_PG_URL: postgresql://postgres:sim@localhost:5432/postgres
        run: node --test supabase/tests/uptime-ingest.sim.mjs
