name: توليد نشرات الأسعار

on:
  push:
    branches: [main]
    paths:
      - 'scripts/price-data.json'
      - 'scripts/bulletin-merge-names.json'
      - 'scripts/generate-price-lists.mjs'
      - 'scripts/generate-pdfs.mjs'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: generate-price-lists
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Generate price list HTML
        run: node scripts/generate-price-lists.mjs
      - name: Detect bulletin changes
        id: bulletin_changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -- public/downloads/*.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "لا تغييرات في الأسعار اليدوية أو المخزون"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.bulletin_changes.outputs.changed == 'true'
        run: npm ci
      - name: Install Playwright Chromium
        if: steps.bulletin_changes.outputs.changed == 'true'
        run: npx playwright install chromium --with-deps
      - name: Generate PDFs
        if: steps.bulletin_changes.outputs.changed == 'true'
        run: node scripts/generate-pdfs.mjs
