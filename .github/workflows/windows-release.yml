name: إصدار Windows (windows-production)

# الغرض: فصل نشر سكربتات الإنتاج على OZK2026 عن الدمج إلى main.
#
# الدمج إلى main ينشر الويب وحده (pages.yml). جهاز Windows يتبع فرع
# windows-production فقط، ولا يتقدّم هذا الفرع إلا بتشغيل يدوي لهذا الـworkflow
# ثم موافقة المالك في بيئة windows-production (Required reviewer). بعدها يُدفع
# الـSHA Fast-Forward (بلا --force) ويُسجَّل GitHub Deployment مرتبط به، وهو ما
# تتحقق منه بوابة Windows المثبّتة في ProgramData قبل أي تحديث.
#
# إعدادات لازمة (خطوة مالك منفصلة، ليست جزءاً من هذا الملف):
#   - Environment «windows-production» بمراجع مطلوب واحد (المالك)، والفرع main وحده.
#   - فرع windows-production يُنشأ مرة واحدة من الـSHA المنشور حالياً على OZK2026.
#   - Ruleset للفرع: منع force push والحذف، والتحديث من تطبيق الإصدار وحده.
#
# هوية الدفع (2026-10-21): GitHub App «OZK Windows Release» (releaseApp في gate-config):
#   - أسرار البيئة RELEASE_APP_ID وRELEASE_APP_PRIVATE_KEY تصل إلى خطوة واحدة فقط في job
#     الإصدار، وهو لا يبدأ إلا بعد موافقة المالك ومن main.
#   - التوكن يُنشأ داخل السكربت بعد إعادة التحقق كاملاً، لحظة الدفع، مقيّداً بهذا المستودع
#     وبصلاحيتي contents/workflows، ويُخفى من السجلات، ويُبطَل بعد الدفع.
#   - GITHUB_TOKEN لا يملك الكتابة على المحتوى هنا، وكل checkout بلا اعتماد محفوظ.
#   - لا يعمل الـworkflow إلا يدوياً ومن main (لا pull_request ولا كود فرع غير مدموج).

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA كامل (40 حرفاً) لـcommit على main"
        required: true
        type: string
      write_scripts_approved:
        description: "موافقة صريحة على تغيير سكربتات الكتابة إلى الأمين (writerScripts)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  verify:
    name: فحص الإصدار
    # لا تشغيل من فرع آخر: كود الفحص والإصدار هو كود main المدموج والمراجَع وحده.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # كل قيمة من المدخلات تمرّ عبر env لا عبر ${{ }} داخل run.
      - name: Verify release candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_WRITE: ${{ inputs.write_scripts_approved }}
        run: |
          git fetch --no-tags origin main
          git fetch --no-tags origin windows-production || true
          node scripts/windows-release-verify.mjs --sha "$INPUT_SHA" --write-approved "$INPUT_WRITE" --out windows-release.json

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.json
          retention-days: 90

  release:
    name: موافقة المالك ثم التقديم
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: windows-production
    # GITHUB_TOKEN: قراءة وتسجيل Deployment فقط. الدفع بتوكن التطبيق داخل خطوة الإصدار وحدها.
    permissions:
      contents: read
      deployments: write
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verification
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # قابل للاستكمال بأمان (Codex P1 #4): يعيد التحقق من الـSHA وmain وCI وموافقة الكتابة،
      # ثم يدفع Fast-Forward فقط إن كان الفرع على الأساس المتحقَّق (بلا --force)، أو يتخطى الدفع
      # إن كان الفرع يساوي الهدف بالضبط (دفعٌ سابق نجح وفشل تسجيله)، ثم يسجّل الإصدار بلا تكرار.
      # أي موضع آخر للفرع = رفض.
      # أسرار التطبيق في هذه الخطوة وحدها، ولا يُنشأ منها توكن إلا بعد إعادة التحقق وقبيل الدفع مباشرة.
      - name: Fast-forward windows-production and record the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          INPUT_SHA: ${{ inputs.sha }}
          APPROVER: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/windows-release-apply.mjs --verification windows-release.json --sha "$INPUT_SHA"
