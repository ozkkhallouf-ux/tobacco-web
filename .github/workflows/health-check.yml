name: فحص صحة المشروع

# مراقبة دورية لصحة الموقع والنشر والنشرات وسير العمل — انظر scripts/health-check.mjs للتفاصيل.
# هذا الفحص لا يستدعي Codex إطلاقاً ولا يحجب أي عملية تشغيلية (نشر أسعار / deployment)؛
# هو اكتشاف وتبليغ فقط (Issue + Telegram)، بلا أي إصلاح تلقائي في هذه المرحلة.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run health checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPABASE_URL: https://dyxbirfpxeocqffnfdeb.supabase.co
          # سرّ اختياري — إن لم يُضبط، يُسجَّل تحذير ويُتخطى إشعار تيليغرام فقط (لا يوقف الفحص).
          # يضبطه المستخدم بنفسه عبر: gh secret set SUPABASE_SERVICE_ROLE_KEY (الاسم الذي تستعمله باقي الـworkflows)
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # الانتقال بين النظامين **صريح** يعلنه المشغّل، ولا يُستنتج أبداً من PGRST202 ولا من الزمن ولا من غياب المفتاح:
          #   legacy (الافتراضي = سلوك الإنتاج اليوم): إغلاق الـIssue بالطريقة القديمة بلا أي طلب لقاعدة البيانات.
          #   managed: يُستعمل public.health_lifecycle (SQL 13) بعد probe جاهز؛ إن لم يكن جاهزاً (تأخّر schema cache/انقطاع/فقدان المفتاح/تراجع 13) تبقى الـIssues مفتوحة ولا رجوع تلقائي إلى legacy.
          #   أي قيمة أخرى = unknown: الـIssues غير الحرجة تبقى مفتوحة.
          # ذرّية الانتقال: يُعلَن managed **قبل** تطبيق SQL 13 مباشرةً (لا يعمل 13 أبداً مع legacy وإلا بقي حدث يتيم)؛ راجع supabase/proposed/README.md. لا يُضبط شيء الآن.
          HEALTH_LIFECYCLE_MODE: ${{ vars.HEALTH_LIFECYCLE_MODE || 'legacy' }}
          # إيقاف طوارئ فقط: القيمة off توقف عمليات دورة الحياة كلياً (صفر طلبات DB) وتسبق أي إعلان؛ غير الحرجة تبقى مفتوحة والحرجة تُغلق.
          HEALTH_LIFECYCLE_SIGNALS: ${{ vars.HEALTH_LIFECYCLE_SIGNALS }}
        run: node scripts/health-check.mjs
